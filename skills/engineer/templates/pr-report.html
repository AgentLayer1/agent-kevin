<script>
(() => {
  const KEY = "agent-theme";
  const CHOICES = {
    auto: ["Auto, follows the system", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='6' fill='none' stroke='currentColor' stroke-width='1.5'/><path d='M8 2a6 6 0 0 1 0 12z' fill='currentColor'/></svg>"],
    light: ["Light", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='3' fill='currentColor'/><path d='M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'/></svg>"],
    dark: ["Dark", "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M13.5 10.2A5.8 5.8 0 0 1 5.8 2.5a5.8 5.8 0 1 0 7.7 7.7z' fill='currentColor'/></svg>"],
  };
  const root = document.documentElement;
  const media = matchMedia("(prefers-color-scheme: dark)");
  const read = () => { try { const saved = localStorage.getItem(KEY); return Object.hasOwn(CHOICES, saved) ? saved : "auto"; } catch (e) { return "auto"; } };
  let choice = read();
  const apply = () => {
    const mode = choice === "auto" ? (media.matches ? "dark" : "light") : choice;
    const changed = root.getAttribute("data-theme") !== mode;
    root.setAttribute("data-theme", mode);
    root.style.colorScheme = mode;
    document.querySelectorAll(".theme-switch button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === choice)));
    if (changed) { document.dispatchEvent(new CustomEvent("themechange", { detail: { mode } })); }
  };
  const choose = (next) => {
    choice = next;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply();
  };
  const mount = () => {
    const slot = document.getElementById("theme-slot");
    const group = document.createElement("div");
    group.className = slot ? "theme-switch" : "theme-switch floating";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Theme");
    Object.entries(CHOICES).forEach(([name, [label, icon]]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.choice = name;
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = icon;
      button.addEventListener("click", () => choose(name));
      group.append(button);
    });
    (slot || document.body).append(group);
    apply();
  };
  media.addEventListener("change", () => { if (choice === "auto") { apply(); } });
  window.addEventListener("storage", (event) => { if (event.key === KEY) { choice = read(); apply(); } });
  apply();
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", mount); } else { mount(); }
})();
</script>

    { "path": "src/orders/cancel.ts", "class": "risk", "concern": "Reservations", "summary": "Cancelling an unpaid order deletes its holds in the same transaction.", "adds": 21, "dels": 4 },
    { "path": "src/orders/routes.ts", "class": "logic", "concern": "Reservations", "summary": "The order route calls reserve() before creating the order.", "adds": 6, "dels": 2 },
    { "path": "src/orders/config.ts", "class": "logic", "concern": "Reservations", "summary": "Adds the 15-minute hold window.", "adds": 3, "dels": 0 },
    { "path": "src/web/checkout/errors.ts", "class": "logic", "concern": "Checkout", "summary": "New sold-out message.", "adds": 12, "dels": 2 },
    { "path": "src/api/client.gen.ts", "class": "mechanical", "concern": "Generated", "summary": "Regenerated client.", "adds": 210, "dels": 140 }
  ],
  "bots": [
    { "bot": "coderabbitai[bot]", "anchor": "src/orders/edit.ts:22", "claim": "Race between read and lock", "disposition": "confirmed", "finding": 1 },
    { "bot": "coderabbitai[bot]", "anchor": "src/orders/cancel.ts:19", "claim": "Holds not deleted on refund failure", "disposition": "false-positive",
      "reason": "The refund and the hold delete share one transaction (cancel.ts:14), so a failed refund rolls the delete back too.",
      "reply": "Both run in the same transaction (`cancel.ts:14`), so a failed refund rolls the hold delete back with it." }
  ],
  "verifiedClean": [
    "The lock order is the same in reserve() and cancel(): item id ascending.",
    "No handler outside src/orders reads the stock column directly."
  ],
  "checks": [
    { "check": "Build", "result": "pass", "notes": "12 tasks" },
    { "check": "Lint", "result": "pass" },
    { "check": "Format", "result": "pass" },
    { "check": "Tests", "result": "partial", "notes": "212 passed, 1 failing on the base too" },
    { "check": "CI recorded", "result": "pass", "notes": "run 4417: build, lint and tests gate the PR" },
    { "check": "Fan-out", "result": "info", "notes": "full: 9 lanes, the PR touches the order path" },
    { "check": "Verification pass", "result": "info", "notes": "6 candidates (2 from bots, 1 from the case against) → 1 finding, 1 question, 1 nit group, 1 dropped, 1 bot false positive" },
    { "check": "Coverage", "result": "info", "notes": "8 files on the checklist: 7 reviewed line by line, 1 generated client skimmed" }
  ],
  "summaryComment": "Changes requested: one race to fix before merge.\n\n1. `src/orders/edit.ts:22`: an edit reads stock before the row lock, so two edits can both hold the last unit.\n\nVerified clean: the lock order in reserve and cancel, and no stock reads outside src/orders. Build, lint, format and tests ran locally.",
  "noticed": [{ "anchor": "src/orders/routes.ts:12", "text": "The rate limit on /orders predates this PR and counts rejected calls." }],
  "dropped": [{ "anchor": "src/orders/config.ts:9", "lanes": ["generated-code"], "claim": "15 minutes is an unexplained constant", "reason": "The linked issue sets 15 minutes." }],
  "notChecked": ["The migration's runtime on a production-sized table."]
}
</script>

<script>
  const DATA = JSON.parse(document.getElementById("pr-report-data").textContent);
  const VERDICTS = {
    "approve": ["✅ Approve", "good"], "approve-with-fixes": ["✅ Approve with fixes", "good"], "needs-discussion": ["💬 Needs discussion", "talk"],
    "changes-requested": ["🟠 Changes requested", "warn"], "do-not-merge": ["🔴 Do not merge", "bad"]
  };
  const SEVERITY_ORDER = ["blocker", "fix-before-merge", "nit"];
  const SEVERITY_LABEL = { "blocker": "blocker", "fix-before-merge": "fix before merge", "nit": "nit", "question": "question" };
  const STATUS_LABEL = { "to-post": "to post", "follow-up": "follow-up", "posted": "posted" };
  const CLASSES = ["risk", "logic", "mechanical"];
  const list = (value) => (Array.isArray(value) ? value : []);

  // Every string from the PR is untrusted: nodes are built from text, and the only innerHTML is Mermaid's SVG under securityLevel strict.
  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([key, val]) => {
      if (val === undefined || val === null || val === false) { return; }
      if (key === "class") { node.className = val; } else { node.setAttribute(key, String(val)); }
    });
    children.flat().filter((child) => child !== undefined && child !== null && child !== false)
      .forEach((child) => node.append(child instanceof Node ? child : document.createTextNode(String(child))));
    return node;
  };

  // Only https URLs become links; anything else in the data (a javascript: URL) stays text.
  const link = (url, ...children) =>
    /^https:\/\//.test(url || "") ? h("a", { href: url, target: "_blank", rel: "noopener" }, ...children) : h("span", {}, ...children);

  const anchorLink = (anchor) => {
    const match = /^([^:]+)(?::(\d+)(?:-(\d+))?)?$/.exec(anchor || "");
    const { repo, head } = DATA.pr;
    if (!match || !repo || !head) { return h("code", {}, anchor); }
    const [, path, start, end] = match;
    const lines = start ? (end ? `#L${start}-L${end}` : `#L${start}`) : "";
    const encoded = path.split("/").map(encodeURIComponent).join("/");
    return link(`https://github.com/${repo}/blob/${head}/${encoded}${lines}`, h("code", {}, anchor));
  };

  const pathOf = (anchor) => (anchor || "").split(":")[0];

  const copyText = async (value) => {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch (err) {
      const area = h("textarea", { style: "position:fixed;opacity:0" });
      area.value = value;
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    }
  };

  const paste = (label, value) => {
    const button = h("button", { type: "button" }, "Copy");
    button.addEventListener("click", async (event) => {
      event.preventDefault();
      const ok = await copyText(value);
      button.textContent = ok ? "Copied" : "Copy failed";
      button.classList.toggle("done", ok);
      setTimeout(() => { button.textContent = "Copy"; button.classList.remove("done"); }, 1600);
    });
    return h("div", { class: "paste" }, h("div", { class: "bar" }, h("span", { class: "label" }, label), button), h("pre", {}, value));
  };

  const field = (key, value) => (value ? h("p", {}, h("span", { class: "k" }, key), value) : null);

  const item = (cls, open, id, summaryParts, bodyParts) =>
    h("details", { class: `item ${cls}`, open: open ? "" : null, id }, h("summary", {}, summaryParts), h("div", { class: "body" }, bodyParts));

  const section = (id, title, sub, ...body) => ({ id, title, node: h("section", { id }, h("h2", {}, title), sub ? h("p", { class: "sub" }, sub) : null, ...body) });

  const table = (heads, rows) => h("table", {}, h("thead", {}, h("tr", {}, heads.map((head) => h("th", {}, head)))), h("tbody", {}, rows.map((row) => h("tr", {}, row.map((cell) => h("td", {}, cell))))));

  const filterBar = (options, onPick) => {
    const buttons = options.map(([value, label], i) => h("button", { type: "button", class: i === 0 ? "on" : "" }, label));
    buttons.forEach((button, i) => button.addEventListener("click", () => {
      buttons.forEach((other) => other.classList.toggle("on", other === button));
      onPick(options[i][0]);
    }));
    return h("div", { class: "filters" }, buttons);
  };

  const renderHeader = (subtitle) => {
    const { pr, stack } = DATA;
    const verdict = VERDICTS[DATA.verdict];
    return h("header", { class: "page" },
      h("div", { class: "eyebrow" }, `PR #${pr.number}${pr.repo ? ` · ${pr.repo}` : ""}${subtitle ? ` · ${subtitle}` : ""}`),
      h("h1", {}, pr.title),
      h("p", { class: "lede" }, DATA.summary),
      h("div", { class: "chips" },
        verdict ? h("span", { class: `chip ${verdict[1]}` }, verdict[0]) : null,
        DATA.draft ? h("span", { class: "chip warn" }, "draft: quick or partial, gates not run") : null,
        DATA.risk ? h("span", { class: "chip" }, `risk ${DATA.risk}`) : null,
        h("span", { class: "chip" }, `@${pr.author}`),
        h("span", { class: "chip" }, `${pr.head} → ${pr.base}`),
        pr.adds !== undefined ? h("span", { class: "chip" }, `+${pr.adds} / −${pr.dels ?? 0}`) : null,
        DATA.executed ? h("span", { class: "chip" }, `executed: ${DATA.executed}`) : null),
      DATA.riskWhy ? h("p", { class: "riskwhy" }, `Risk ${DATA.risk}: ${DATA.riskWhy}`) : null,
      list(stack).length ? h("div", { class: "stack" },
        stack.flatMap((layer, i) => [
          i ? h("span", { class: "arrow" }, "→") : null,
          h("span", { class: `layer${layer.current ? " current" : ""}`, title: layer.title }, `#${layer.number} ${layer.title}`)
        ])) : null);
  };

  const checksTable = () => list(DATA.checks).length
    ? section("checks", "Checks run", null, h("div", { class: "card" }, table(["Check", "Result", "Notes"],
        DATA.checks.map((row) => [row.check, h("span", { class: `pill ${row.result}` }, row.result), row.notes || ""]))))
    : null;

  const textList = (id, title, sub, items) => list(items).length
    ? section(id, title, sub, h("div", { class: "card" }, h("ul", { class: "plain" }, items.map((entry) => h("li", {}, entry)))))
    : null;

  const priorSection = () => (list(DATA.sinceLast).length || list(DATA.prior).length)
    ? section("prior", "Prior context", null, h("div", { class: "card" },
        list(DATA.sinceLast).length ? [h("h3", { style: "margin-top:0" }, "Since the last run"), h("ul", { class: "plain" }, DATA.sinceLast.map((entry) => h("li", {}, entry)))] : null,
        list(DATA.prior).length ? h("ul", { class: "plain" }, DATA.prior.map((entry) => h("li", {}, entry))) : null))
    : null;

  // ---------- review ----------

  const findingCard = (finding, open, anchorId) => item(finding.severity, open, anchorId,
    [h("span", { class: `pill ${finding.severity}` }, SEVERITY_LABEL[finding.severity]), h("span", { class: "meta" }, `#${finding.id}`),
     h("span", { class: "title" }, finding.title), anchorLink(finding.anchor)],
    [field("Failure", finding.failure), field("Evidence", finding.evidence),
     field("Lane", [list(finding.lanes).join(", "), finding.principle, finding.introduced ? `introduced: ${finding.introduced}` : null].filter(Boolean).join(" · ")),
     paste(finding.severity === "question" ? "Question to paste" : "Comment to paste", finding.comment)]);

  const reviewSections = () => {
    const findings = list(DATA.findings);
    const issues = findings.filter((finding) => finding.severity !== "question")
      .sort((a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity));
    const questions = findings.filter((finding) => finding.severity === "question");

    const look = section("look", "Where to look", "The hunks a human should read. The review lanes read everything else.",
      h("div", { class: "card" },
        h("ol", { class: "look" }, DATA.lookAt.map((entry) => h("li", {}, h("div", {}, anchorLink(entry.anchor), h("div", {}, entry.why))))),
        DATA.skim ? h("div", { class: "skim" }, "Skim · ", DATA.skim) : null),
      list(DATA.decisions).length ? h("div", { class: "card" }, h("h3", {}, "Decisions this PR makes for you"),
        table(["Decision", "Picks", "Where"], DATA.decisions.map((row) => [row.decision, row.picks, anchorLink(row.anchor)]))) : null,
      list(DATA.asked).length ? h("div", { class: "card" }, h("h3", {}, "Asked vs delivered"),
        table(["Criterion", "Status", "Where"], DATA.asked.map((row) => [row.criterion, h("span", { class: `pill ${row.status}` }, row.status.replace(/-/g, " ")), row.anchor ? anchorLink(row.anchor) : ""]))) : null);

    const how = section("how", "How it works", null,
      DATA.explanation ? h("p", { class: "prose" }, DATA.explanation) : null,
      list(DATA.flows).length ? h("div", { class: "grid" }, DATA.flows.map((flow) => h("div", { class: "card" },
        h("h3", { style: "margin-top:0" }, flow.title),
        h("div", { class: "diagram" }, h("pre", {}, flow.diagram)),
        list(flow.steps).length ? h("ol", { class: "steps" }, flow.steps.map((step) => h("li", {}, step.anchor ? [anchorLink(step.anchor), " "] : null, step.text))) : null))) : null,
      list(DATA.areas).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Walkthrough"),
        table(["Area", "What changed", "Why it matters"], DATA.areas.map((row) => [h("code", {}, row.area), row.what, row.why]))) : null,
      list(DATA.behavior).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Before → after"),
        table(["Case", "Before", "After"], DATA.behavior.map((row) => [row.case, row.before, row.after]))) : null,
      list(DATA.holdQuestions).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Questions to hold in your head"),
        h("ul", { class: "plain" }, DATA.holdQuestions.map((entry) => h("li", {}, entry)))) : null);

    const against = DATA.caseAgainst ? section("against", "Case against", null, h("div", { class: "grid three" },
      [["Strongest argument against merging", DATA.caseAgainst.strongest], ["Most likely to bite in three months", DATA.caseAgainst.threeMonths], ["If 40% had to go", DATA.caseAgainst.cut]]
        .map(([label, value]) => h("div", { class: "card against" }, h("div", { class: "label" }, label), h("div", {}, value))))) : null;

    const findingsSection = section("findings", "Findings", issues.length ? "Open a card for the evidence and the comment to paste on that line." : null,
      issues.length ? issues.map((finding) => findingCard(finding, finding.severity !== "nit", `finding-${finding.id}`)) : h("p", { class: "empty" }, "No findings."));

    const questionsSection = questions.length ? section("questions", "Questions for the author", "Real but unproven: asked, not asserted.",
      questions.map((finding) => findingCard(finding, false, `finding-${finding.id}`))) : null;

    const fileList = h("div", {});
    const drawFiles = (filter) => {
      fileList.replaceChildren();
      const files = DATA.files.filter((file) => filter === "all" || file.class === filter);
      [...new Set(files.map((file) => file.concern))].forEach((concern) => fileList.append(h("div", { class: "concern" },
        h("div", { class: "name" }, concern),
        files.filter((file) => file.concern === concern).map((file) => {
          const cards = findings.filter((finding) => pathOf(finding.anchor) === file.path);
          return item(file.class, file.class === "risk" || cards.length > 0, null,
            [h("span", { class: `pill ${file.class}` }, file.class), h("code", {}, file.path), h("span", { class: "title" }, file.summary),
             cards.length ? h("span", { class: "meta" }, `${cards.length} comment${cards.length > 1 ? "s" : ""}`) : null,
             file.adds !== undefined ? h("span", { class: "meta" }, `+${file.adds} −${file.dels ?? 0}`) : null],
            [list(file.hunks).length ? h("ul", { class: "plain" }, file.hunks.map((hunk) => h("li", {}, anchorLink(`${file.path}:${hunk.lines}`), " ", hunk.text))) : null,
             cards.length ? h("div", { class: "nested" }, cards.map((finding) => findingCard(finding, false, null))) : null]);
        }))));
    };
    const drawFilesOrEmpty = (filter) => {
      drawFiles(filter);
      if (!fileList.children.length) { fileList.append(h("p", { class: "empty" }, "No files in this view.")); }
    };
    drawFilesOrEmpty("all");
    const counts = Object.fromEntries(CLASSES.map((cls) => [cls, DATA.files.filter((file) => file.class === cls).length]));
    const files = section("files", "File map", "Every file, grouped by concern, with the comments anchored in it.",
      filterBar([["all", `all ${DATA.files.length}`], ...CLASSES.map((cls) => [cls, `${cls} ${counts[cls]}`])], drawFilesOrEmpty), fileList);

    const bots = list(DATA.bots).length ? section("bots", "Bot comments", "Every bot claim, verified like a lane finding.",
      DATA.bots.map((bot) => item(bot.disposition, bot.disposition === "false-positive", null,
        [h("span", { class: `pill ${bot.disposition}` }, bot.disposition.replace(/-/g, " ")), h("span", { class: "meta" }, bot.bot),
         h("span", { class: "title" }, bot.claim), bot.anchor ? anchorLink(bot.anchor) : null, bot.finding ? h("a", { href: `#finding-${bot.finding}`, class: "meta" }, `→ #${bot.finding}`) : null],
        [field("Why", bot.reason), bot.reply ? paste("Reply to the bot's thread", bot.reply) : null]))) : null;

    const clean = textList("clean", "Verified clean", "What was checked and found right.", DATA.verifiedClean);
    const summary = DATA.summaryComment ? section("summary", "Summary comment", "Optional top-level comment for the PR conversation.", paste("Summary to paste", DATA.summaryComment)) : null;
    const noticed = list(DATA.noticed).length ? section("noticed", "Noticed, not this PR's problem", null,
      h("div", { class: "card" }, h("ul", { class: "plain" }, DATA.noticed.map((entry) => h("li", {}, anchorLink(entry.anchor), " ", entry.text))))) : null;
    const dropped = list(DATA.dropped).length ? section("dropped", "Dropped after verification", "Rescue one if the reason is wrong.",
      item("mechanical", false, null, [h("span", { class: "title" }, `${DATA.dropped.length} candidates dropped`)],
        [h("ul", { class: "plain" }, DATA.dropped.map((entry) => h("li", {}, anchorLink(entry.anchor), ` · ${[list(entry.lanes).join(", "), entry.claim].filter(Boolean).join(": ")} · dropped because ${entry.reason}`)))])) : null;
    const notChecked = textList("not-checked", "Not checked", null, DATA.notChecked);

    return [look, how, against, findingsSection, questionsSection, files, bots, clean, checksTable(), summary, noticed, dropped, notChecked, priorSection()];
  };

  // ---------- replies ----------

  const WHERE_TITLE = { inline: "Inline threads", conversation: "Conversation", review: "Review bodies" };

  const threadCard = (thread) => item(thread.status, thread.status !== "posted", null,
    [h("span", { class: `pill ${thread.status}` }, STATUS_LABEL[thread.status]), h("span", { class: "title" }, thread.point),
     h("span", { class: "meta" }, thread.reviewer), thread.bot ? h("span", { class: "pill bot" }, "bot") : null,
     thread.anchor ? anchorLink(thread.anchor) : null, thread.outdated ? h("span", { class: "meta" }, "outdated") : null],
    [h("p", { class: "quote" }, `${thread.reviewer} wrote: “${thread.quote}”`),
     thread.reply ? paste(thread.status === "follow-up" ? "Follow-up to paste" : "Reply to paste", thread.reply) : h("p", { class: "empty" }, "Nothing new."),
     h("p", {}, link(thread.url, `Open thread ${thread.id} ↗`))]);

  const repliesSections = () => {
    const threads = list(DATA.threads);
    const prOfThread = (thread) => thread.pr ?? DATA.pr.number;
    const prs = [...new Set(threads.map(prOfThread))];
    const threadList = h("div", {});
    const drawThreads = (filter) => {
      threadList.replaceChildren();
      const shown = threads.filter((thread) => filter === "all" || thread.status === filter);
      const groups = prs.length > 1 ? prs.map((pr) => [`#${pr}`, shown.filter((thread) => prOfThread(thread) === pr)]) : [[null, shown]];
      groups.forEach(([prLabel, group]) => {
        if (prLabel && group.length) { threadList.append(h("h3", {}, prLabel)); }
        ["inline", "conversation", "review"].forEach((where) => {
          const inWhere = group.filter((thread) => thread.where === where);
          if (inWhere.length) { threadList.append(h("div", { class: "concern" }, h("div", { class: "name" }, WHERE_TITLE[where]), inWhere.map(threadCard))); }
        });
      });
      if (!shown.length) { threadList.append(h("p", { class: "empty" }, "No threads in this view.")); }
    };
    drawThreads("all");
    const count = (status) => threads.filter((thread) => thread.status === status).length;
    const threadsSection = section("threads", "Threads", "In PR scroll order. Paste each reply on the thread it links to.",
      filterBar([["all", `all ${threads.length}`], ["to-post", `to post ${count("to-post")}`], ["follow-up", `follow-up ${count("follow-up")}`], ["posted", `posted ${count("posted")}`]], drawThreads),
      threadList);

    const own = list(DATA.ownFindings).length ? section("own", "Found on my own", "From the self-pass over the diff.",
      DATA.ownFindings.map((finding) => item("fix-before-merge", true, null,
        [h("span", { class: "title" }, finding.title), anchorLink(finding.anchor)],
        [h("p", {}, finding.detail), finding.comment ? paste("Comment to leave on the line", finding.comment) : null]))) : null;
    const commits = list(DATA.commits).length ? section("commits", "Suggested commits", "One per group of related fixes; you commit.",
      DATA.commits.map((commit) => paste("Commit message", commit.body ? `${commit.subject}\n\n${commit.body}` : commit.subject))) : null;
    const resolve = list(DATA.resolveOnly).length ? section("resolve", "Just needs Resolve", null,
      h("div", { class: "card" }, h("ul", { class: "plain" }, DATA.resolveOnly.map((entry) => h("li", {}, entry.anchor ? [anchorLink(entry.anchor), " "] : null, `${entry.topic} — ${entry.why}`))))) : null;
    const open = textList("open", "Still open", null, DATA.stillOpen);
    return [threadsSection, own, commits, resolve, open, checksTable(), priorSection()];
  };

  // ---------- page ----------

  const sections = (DATA.kind === "replies" ? repliesSections() : reviewSections()).filter(Boolean);
  const root = document.getElementById("render");
  root.append(
    renderHeader(DATA.kind === "replies" ? "replies" : "review"),
    h("nav", { class: "jump" }, sections.map((entry) => h("a", { href: `#${entry.id}` }, entry.title)), h("span", { id: "theme-slot" })),
    ...sections.map((entry) => entry.node),
    h("footer", {}, "Rendered from the pr-report-data block in this file. Diagram sources show as text when the diagram library can't load."));
  document.title = `PR #${DATA.pr.number}${DATA.kind === "replies" ? " replies" : ""} — ${DATA.pr.title}`;

  // Section jumps land below the sticky nav, which wraps to more rows on narrow screens.
  const nav = document.querySelector("nav.jump");
  const fitNav = () => document.documentElement.style.setProperty("--nav-h", `${nav.offsetHeight}px`);
  fitNav();
  window.addEventListener("resize", fitNav);

  let mermaidLib = null;
  const drawDiagrams = async () => {
    if (!mermaidLib) { return; }
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    mermaidLib.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
    const boxes = [...document.querySelectorAll(".diagram")];
    await Promise.all(boxes.map(async (box, i) => {
      const source = box.dataset.source || box.textContent;
      box.dataset.source = source;
      try {
        const { svg } = await mermaidLib.render(`diagram-${i}-${Date.now()}`, source);
        box.innerHTML = svg;
      } catch (err) {
        box.replaceChildren(h("pre", {}, source));
      }
    }));
  };
  if (document.querySelector(".diagram")) {
    window.__renderDone = false;
    import("https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs")
      .then((module) => { mermaidLib = module.default; return drawDiagrams(); })
      .catch(() => {})
      .finally(() => { window.__renderDone = true; });
  }

  document.addEventListener("themechange", drawDiagrams);
</script>
</body>
</html>
