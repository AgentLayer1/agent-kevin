<!-- theme:start -->
<style>
  .theme-switch { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; color: inherit;
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent); background: color-mix(in srgb, currentColor 5%, transparent); }
  .theme-switch.floating { position: fixed; top: 14px; right: 14px; z-index: 50;
    background: color-mix(in srgb, Canvas 82%, transparent); backdrop-filter: blur(8px); }
  .theme-switch button { all: unset; box-sizing: border-box; cursor: pointer; width: 28px; height: 24px; border-radius: 999px;
    display: grid; place-items: center; opacity: .55; transition: opacity .15s, background .15s; }
  .theme-switch button:hover { opacity: .9; }
  .theme-switch button[aria-pressed="true"] { opacity: 1; background: color-mix(in srgb, currentColor 15%, transparent); }
  .theme-switch button:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  .theme-switch svg { width: 14px; height: 14px; display: block; }
  .to-top { all: unset; box-sizing: border-box; position: fixed; top: 14px; left: 14px; z-index: 50; width: 32px; height: 32px;
    display: grid; place-items: center; border-radius: 999px; cursor: pointer; color: inherit;
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent); background: color-mix(in srgb, Canvas 82%, transparent);
    backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .to-top.shown { opacity: .7; pointer-events: auto; }
  .to-top:hover { opacity: 1; }
  .to-top:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  .to-top svg { width: 14px; height: 14px; display: block; }
  @media print { .theme-switch, .to-top { display: none !important; } }
</style>
<script>
(() => {
  const KEY = "agent-theme";
  const CHOICES = {
    auto: ["Auto, follows the system", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='6' fill='none' stroke='currentColor' stroke-width='1.5'/><path d='M8 2a6 6 0 0 1 0 12z' fill='currentColor'/></svg>"],
    light: ["Light", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='3' fill='currentColor'/><path d='M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'/></svg>"],
    dark: ["Dark", "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M13.5 10.2A5.8 5.8 0 0 1 5.8 2.5a5.8 5.8 0 1 0 7.7 7.7z' fill='currentColor'/></svg>"],
  };
  const root = document.documentElement;
  const media = matchMedia("(prefers-color-scheme: dark)");
  const read = () => { try { const saved = localStorage.getItem(KEY); return Object.hasOwn(CHOICES, saved) ? saved : "auto"; } catch (e) { return "auto"; } };
  let choice = read();
  const apply = () => {
    const mode = choice === "auto" ? (media.matches ? "dark" : "light") : choice;
    const changed = root.getAttribute("data-theme") !== mode;
    root.setAttribute("data-theme", mode);
    root.style.colorScheme = mode;
    document.querySelectorAll(".theme-switch button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === choice)));
    if (changed) { document.dispatchEvent(new CustomEvent("themechange", { detail: { mode } })); }
  };
  const choose = (next) => {
    choice = next;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply();
  };
  const mount = () => {
    const slot = document.getElementById("theme-slot");
    const group = document.createElement("div");
    group.className = slot ? "theme-switch" : "theme-switch floating";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Theme");
    Object.entries(CHOICES).forEach(([name, [label, icon]]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.choice = name;
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = icon;
      button.addEventListener("click", () => choose(name));
      group.append(button);
    });
    (slot || document.body).append(group);
    if (!slot) { mountToTop(); }
    apply();
  };
  // Pages with a floating switch are long reads; a slotted switch sits in an app header that has its own navigation.
  const mountToTop = () => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "to-top";
    button.title = "Back to top";
    button.setAttribute("aria-label", "Back to top");
    button.innerHTML = "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M8 13V3M3.5 7.5 8 3l4.5 4.5' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>";
    button.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    const show = () => {
      const shown = window.scrollY > window.innerHeight / 2;
      button.classList.toggle("shown", shown);
      button.tabIndex = shown ? 0 : -1;
    };
    window.addEventListener("scroll", show, { passive: true });
    document.body.append(button);
    show();
  };
  media.addEventListener("change", () => { if (choice === "auto") { apply(); } });
  window.addEventListener("storage", (event) => { if (event.key === KEY) { choice = read(); apply(); } });
  apply();
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", mount); } else { mount(); }
})();
</script>
<!-- theme:end -->
<!-- diagram-viewer:start -->
<style>
  .diagram { position: relative; }
  .dv-open { all: unset; box-sizing: border-box; position: absolute; top: 8px; right: 8px; z-index: 2; display: grid; place-items: center; width: 30px; height: 30px;
    border-radius: 8px; cursor: pointer; color: CanvasText; opacity: .35; transition: opacity .15s;
    border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); background: color-mix(in srgb, Canvas 85%, transparent); }
  .diagram:hover .dv-open, .dv-open:focus-visible { opacity: 1; }
  .dv-open svg { width: 15px; height: 15px; display: block; }
  dialog.dv { width: 96vw; height: 94vh; max-width: none; max-height: none; padding: 0; overflow: hidden; border-radius: 14px;
    border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); background: Canvas; color: CanvasText; }
  dialog.dv[open] { display: flex; flex-direction: column; }
  dialog.dv::backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(3px); }
  .dv-bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    font: 12px/1.2 ui-monospace, "IBM Plex Mono", monospace; }
  .dv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 14px/1.2 system-ui, sans-serif; }
  .dv-bar button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
  .dv-bar button:hover, .dv-bar button:focus-visible { background: color-mix(in srgb, CanvasText 9%, transparent); }
  .dv-bar button[hidden] { display: none; }
  .dv-zoom { min-width: 46px; text-align: center; opacity: .7; }
  .dv-stage { flex: 1; display: flex; overflow: auto; cursor: grab; touch-action: none; outline: none; }
  .dv-stage.dragging { cursor: grabbing; }
  .dv-stage > svg { margin: 20px auto auto; flex: none; max-width: none !important; }
  @media print { .dv-open { display: none; } }
</style>
<script>
(() => {
  const ICON = "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>";
  const MIN = 0.1;
  const MAX = 8;
  const STEP = 1.25;
  let dialog = null;
  let stage = null;
  let label = null;
  let heading = null;
  let copier = null;
  let copied = 0;
  let current = null;
  let shown = null;
  let natural = { width: 1, height: 1 };
  let scale = 1;

  const clamp = (value) => Math.min(MAX, Math.max(MIN, value));

  const button = (text, title, onClick) => {
    const node = document.createElement("button");
    node.type = "button";
    node.textContent = text;
    node.title = title;
    node.setAttribute("aria-label", title);
    node.addEventListener("click", onClick);
    return node;
  };

  const apply = () => {
    const svg = stage.firstElementChild;
    if (!svg) { return; }
    svg.style.width = natural.width * scale + "px";
    svg.style.height = natural.height * scale + "px";
    label.textContent = Math.round(scale * 100) + "%";
  };

  // Zoom around the middle of the view, so the part being read stays put.
  const zoomTo = (next) => {
    const middleX = (stage.scrollLeft + stage.clientWidth / 2) / scale;
    const middleY = (stage.scrollTop + stage.clientHeight / 2) / scale;
    scale = clamp(next);
    apply();
    stage.scrollLeft = middleX * scale - stage.clientWidth / 2;
    stage.scrollTop = middleY * scale - stage.clientHeight / 2;
  };

  const whole = () => Math.min((stage.clientWidth - 40) / natural.width, (stage.clientHeight - 40) / natural.height);

  const fit = () => {
    scale = clamp(whole());
    apply();
  };

  // Open at the window's width, never past actual size, so a tall diagram reads larger than inline and scrolls; Fit shows all of it.
  const initial = () => {
    scale = clamp(Math.max(whole(), Math.min(1, (stage.clientWidth - 40) / natural.width)));
    apply();
  };

  const show = () => {
    const source = current.querySelector(":scope > svg");
    if (!source) { return; }
    const box = source.viewBox && source.viewBox.baseVal;
    const rect = source.getBoundingClientRect();
    natural = box && box.width ? { width: box.width, height: box.height } : { width: rect.width || 1, height: rect.height || 1 };
    const svg = source.cloneNode(true);
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    stage.replaceChildren(svg);
    shown = source;
    apply();
  };

  // Copied as a fenced block, so it pastes straight into a markdown file.
  const copy = () => {
    const fenced = "```mermaid\n" + current.dataset.source.trim() + "\n```\n";
    const done = (text) => {
      copier.textContent = text;
      clearTimeout(copied);
      copied = setTimeout(() => { copier.textContent = "Copy"; }, 1500);
    };
    (navigator.clipboard ? navigator.clipboard.writeText(fenced) : Promise.reject()).then(() => done("Copied"), () => done("Copy failed"));
  };

  const build = () => {
    dialog = document.createElement("dialog");
    dialog.className = "dv";
    dialog.setAttribute("aria-label", "Diagram");
    heading = document.createElement("span");
    heading.className = "dv-title";
    label = document.createElement("span");
    label.className = "dv-zoom";
    copier = button("Copy", "Copy Mermaid source", copy);
    const bar = document.createElement("div");
    bar.className = "dv-bar";
    bar.append(heading, button("−", "Zoom out (-)", () => zoomTo(scale / STEP)), label, button("+", "Zoom in (+)", () => zoomTo(scale * STEP)),
      button("Fit", "Fit to window (0)", fit), button("1:1", "Actual size (1)", () => zoomTo(1)), copier, button("✕", "Close (Esc)", () => dialog.close()));
    stage = document.createElement("div");
    stage.className = "dv-stage";
    stage.tabIndex = -1;
    dialog.append(bar, stage);
    dialog.addEventListener("click", (event) => { if (event.target === dialog) { dialog.close(); } });
    dialog.addEventListener("close", () => { current = null; shown = null; stage.replaceChildren(); });
    dialog.addEventListener("keydown", (event) => {
      const action = { "+": () => zoomTo(scale * STEP), "=": () => zoomTo(scale * STEP), "-": () => zoomTo(scale / STEP), "0": fit, "1": () => zoomTo(1) }[event.key];
      if (action) { event.preventDefault(); action(); }
    });
    // A trackpad pinch arrives as a wheel event with ctrlKey set.
    stage.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && !event.metaKey) { return; }
      event.preventDefault();
      zoomTo(scale * Math.exp(-event.deltaY / 250));
    }, { passive: false });
    let drag = null;
    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) { return; }
      drag = { x: event.clientX, y: event.clientY, left: stage.scrollLeft, top: stage.scrollTop };
      stage.setPointerCapture(event.pointerId);
      stage.classList.add("dragging");
    });
    stage.addEventListener("pointermove", (event) => {
      if (!drag) { return; }
      stage.scrollLeft = drag.left - (event.clientX - drag.x);
      stage.scrollTop = drag.top - (event.clientY - drag.y);
    });
    const release = () => { drag = null; stage.classList.remove("dragging"); };
    stage.addEventListener("pointerup", release);
    stage.addEventListener("pointercancel", release);
    document.body.append(dialog);
  };

  const titleOf = (box) => {
    const container = box.closest("figure, .card, section, article");
    const found = container && container.querySelector("figcaption, h1, h2, h3, h4");
    return box.dataset.title || (found && found.textContent.trim()) || "Diagram";
  };

  const open = (box) => {
    if (!dialog) { build(); }
    current = box;
    heading.textContent = titleOf(box);
    copier.hidden = !box.dataset.source;
    copier.textContent = "Copy";
    show();
    dialog.showModal();
    stage.focus();
    requestAnimationFrame(initial);
  };

  // Pages draw (and redraw on a theme flip) by replacing a .diagram's contents, so watch for the SVG instead of hooking each page's renderer.
  const attach = (box) => {
    const svg = box.querySelector(":scope > svg");
    if (!svg) { return; }
    if (!box.querySelector(":scope > .dv-open")) {
      const opener = document.createElement("button");
      opener.type = "button";
      opener.className = "dv-open";
      opener.title = "Expand diagram";
      opener.setAttribute("aria-label", "Expand diagram");
      opener.innerHTML = ICON;
      opener.addEventListener("click", () => open(box));
      box.append(opener);
    }
    if (box === current && dialog && dialog.open && shown !== svg) { show(); }
  };

  const start = () => {
    document.querySelectorAll(".diagram").forEach(attach);
    new MutationObserver((records) => records.forEach((record) => {
      const box = record.target.closest && record.target.closest(".diagram");
      if (box) { attach(box); }
    })).observe(document.body, { childList: true, subtree: true });
  };

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", start); } else { start(); }
})();
</script>
<!-- diagram-viewer:end -->

    { "who": "grace", "kind": "person", "url": "https://github.com/acme/shop/pull/418#issuecomment-2000000001", "point": "Does this need #419 first?", "state": "unanswered", "finding": 3,
      "note": "Asked on the PR two days ago; the author hasn't replied. Question 3 asks the same thing, so it goes on this thread." }
  ],
  "verifiedClean": [
    "The lock order is the same in reserve() and cancel(): item id ascending.",
    "No handler outside src/orders reads the stock column directly."
  ],
  "checks": [
    { "check": "Build", "result": "pass", "notes": "12 tasks" },
    { "check": "Lint", "result": "pass" },
    { "check": "Format", "result": "pass" },
    { "check": "Tests", "result": "partial", "notes": "212 passed, 1 failing on the base too" },
    { "check": "CI recorded", "result": "pass", "notes": "run 4417: build, lint and tests gate the PR" },
    { "check": "Fan-out", "result": "info", "notes": "full: 9 lanes, the PR touches the order path" },
    { "check": "Verification pass", "result": "info", "notes": "6 candidates (2 from bots, 1 from the case against) → 1 finding, 1 question, 1 nit group, 1 dropped, 1 bot false positive" },
    { "check": "Coverage", "result": "info", "notes": "8 files on the checklist: 7 reviewed line by line, 1 generated client skimmed" }
  ],
  "summaryComment": "Changes requested: one race to fix before merge.\n\n1. `src/orders/edit.ts:22`: an edit reads stock before the row lock, so two edits can both hold the last unit.\n\nVerified clean: the lock order in reserve and cancel, and no stock reads outside src/orders. Build, lint, format and tests ran locally.",
  "noticed": [{ "anchor": "src/orders/routes.ts:12", "text": "The rate limit on /orders predates this PR and counts rejected calls." }],
  "dropped": [{ "anchor": "src/orders/config.ts:9", "lanes": ["generated-code"], "claim": "15 minutes is an unexplained constant", "reason": "The linked issue sets 15 minutes." }],
  "notChecked": ["The migration's runtime on a production-sized table."]
}
</script>

<script>
  const DATA = JSON.parse(document.getElementById("pr-report-data").textContent);
  const VERDICTS = {
    "approve": ["✅ Approve", "good"], "approve-with-fixes": ["✅ Approve with fixes", "good"], "needs-discussion": ["💬 Needs discussion", "talk"],
    "changes-requested": ["🟠 Changes requested", "warn"], "do-not-merge": ["🔴 Do not merge", "bad"]
  };
  const SEVERITY_ORDER = ["blocker", "fix-before-merge", "nit"];
  const SEVERITY_LABEL = { "blocker": "blocker", "fix-before-merge": "fix before merge", "nit": "nit", "question": "question" };
  const STATUS_LABEL = { "to-post": "to post", "follow-up": "follow-up", "posted": "posted" };
  const CLASSES = ["risk", "logic", "mechanical"];
  const list = (value) => (Array.isArray(value) ? value : []);

  // Every string from the PR is untrusted: nodes are built from text, and the only innerHTML is Mermaid's SVG under securityLevel strict.
  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([key, val]) => {
      if (val === undefined || val === null || val === false) { return; }
      if (key === "class") { node.className = val; } else { node.setAttribute(key, String(val)); }
    });
    children.flat().filter((child) => child !== undefined && child !== null && child !== false)
      .forEach((child) => node.append(child instanceof Node ? child : document.createTextNode(String(child))));
    return node;
  };

  // Only https URLs become links; anything else in the data (a javascript: URL) stays text.
  const link = (url, ...children) =>
    /^https:\/\//.test(url || "") ? h("a", { href: url, target: "_blank", rel: "noopener" }, ...children) : h("span", {}, ...children);

  const anchorLink = (anchor, head = DATA.pr.head) => {
    const match = /^([^:]+)(?::(\d+)(?:-(\d+))?)?$/.exec(anchor || "");
    const { repo } = DATA.pr;
    if (!match || !repo || !head) { return h("code", {}, anchor); }
    const [, path, start, end] = match;
    const lines = start ? (end ? `#L${start}-L${end}` : `#L${start}`) : "";
    const encoded = path.split("/").map(encodeURIComponent).join("/");
    return link(`https://github.com/${repo}/blob/${head}/${encoded}${lines}`, h("code", {}, anchor));
  };

  const pathOf = (anchor) => (anchor || "").split(":")[0];

  // A stack's page says which PR each comment goes on; a single PR's page doesn't need to.
  const STACKED = list(DATA.stack).length > 1;
  const prOfUrl = (url) => Number((/\/pull\/(\d+)/.exec(url || "") || [])[1]) || null;
  // A stacked finding is read at its own PR's head, since that is the diff its comment goes on.
  const layerHead = (n) => (STACKED && list(DATA.stack).find((layer) => layer.number === n)?.head) || DATA.pr.head;
  const layerPill = (n) => (STACKED && n ? h("span", { class: "pill layer" }, `PR #${n}`) : null);

  // GitHub's Files tab names each file's diff by the SHA-256 of its path; until the hash resolves, the link opens the tab.
  const filesLink = (n, anchor, ...children) => {
    const node = link(`https://github.com/${DATA.pr.repo}/pull/${n}/files`, ...children);
    const [, path, start] = /^([^:]+)(?::(\d+))?/.exec(anchor || "") || [];
    if (path && node.href && globalThis.crypto && crypto.subtle) {
      crypto.subtle.digest("SHA-256", new TextEncoder().encode(path))
        .then((hash) => { node.href += `#diff-${[...new Uint8Array(hash)].map((byte) => byte.toString(16).padStart(2, "0")).join("")}${start ? `R${start}` : ""}`; })
        .catch(() => {});
    }
    return node;
  };

  // Hides the cards of other layers, and any group heading left with nothing under it.
  const layerFilter = (box, layerOf, items) => {
    if (!STACKED) { return null; }
    const count = (n) => items.filter((entry) => layerOf(entry) === n).length;
    return filterBar([["all", `all PRs ${items.length}`], ...DATA.stack.map((layer) => [layer.number, `#${layer.number} ${count(layer.number)}`])], (pick) => {
      const nodes = [...box.children];
      nodes.forEach((node) => { if (node.dataset.pr) { node.style.display = pick === "all" || Number(node.dataset.pr) === pick ? "" : "none"; } });
      nodes.forEach((node, i) => {
        if (node.dataset.pr) { return; }
        const next = nodes.slice(i + 1);
        const end = next.findIndex((other) => !other.dataset.pr);
        node.style.display = (end === -1 ? next : next.slice(0, end)).some((other) => other.style.display !== "none") ? "" : "none";
      });
    });
  };

  const copyText = async (value) => {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch (err) {
      const area = h("textarea", { style: "position:fixed;opacity:0" });
      area.value = value;
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    }
  };

  // A preview the way GitHub renders a comment, built as nodes so pasted text never becomes markup. Links stay https-only through link().
  const inline = (text) => {
    const parts = [];
    let last = 0;
    [...String(text).matchAll(/`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g)].forEach((match) => {
      parts.push(text.slice(last, match.index));
      parts.push(match[1] !== undefined ? h("code", {}, match[1]) : match[2] !== undefined ? h("strong", {}, inline(match[2])) : link(match[4], inline(match[3])));
      last = match.index + match[0].length;
    });
    parts.push(text.slice(last));
    return parts.filter((part) => part !== "");
  };

  const markdownView = (source) => {
    const root = h("div", { class: "md" });
    const stack = [root];
    const top = () => stack[stack.length - 1];
    const lines = String(source).split("\n");
    const state = { paragraph: [], list: null };
    const endParagraph = () => {
      if (state.paragraph.length) {
        top().append(h("p", {}, state.paragraph.flatMap((line, i) => [i ? h("br", {}) : null, ...inline(line)])));
      }
      state.paragraph = [];
    };
    const endBlock = () => { endParagraph(); state.list = null; };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fence = /^\s*```(\w*)\s*$/.exec(line);
      const details = /^\s*<details>\s*(?:<summary>(.*)<\/summary>)?\s*$/.exec(line);
      const heading = /^(#{1,6})\s+(.*)$/.exec(line);
      const item = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
      if (fence) {
        endBlock();
        const body = [];
        for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) { body.push(lines[i]); }
        const code = body.join("\n");
        if (fence[1] === "mermaid") {
          top().append(h("div", { class: "diagram" }, h("pre", {}, code)));
        } else {
          if (fence[1] === "suggestion") { top().append(h("div", { class: "md-label" }, "Suggested change")); }
          top().append(h("pre", {}, h("code", {}, code)));
        }
      } else if (details) {
        endBlock();
        const block = h("details", {}, h("summary", {}, inline(details[1] || "Details")));
        top().append(block);
        stack.push(block);
      } else if (/^\s*<\/details>\s*$/.test(line)) {
        endBlock();
        if (stack.length > 1) { stack.pop(); }
      } else if (heading) {
        endBlock();
        top().append(h("div", { class: `md-h md-h${Math.min(heading[1].length, 3)}` }, inline(heading[2])));
      } else if (item) {
        endParagraph();
        const ordered = /\d/.test(item[2]);
        if (!state.list || state.list.tagName !== (ordered ? "OL" : "UL")) {
          state.list = h(ordered ? "ol" : "ul", {});
          top().append(state.list);
        }
        state.list.append(h("li", {}, inline(item[3])));
      } else if (!line.trim()) {
        endBlock();
      } else if (state.list && /^\s+\S/.test(line)) {
        state.list.lastElementChild?.append(h("br", {}), ...inline(line.trim()));
      } else {
        state.list = null;
        state.paragraph.push(line);
      }
    }
    endBlock();
    return root;
  };

  const paste = (label, value) => {
    const button = h("button", { type: "button", class: "copy" }, "Copy");
    button.addEventListener("click", async (event) => {
      event.preventDefault();
      const ok = await copyText(value);
      button.textContent = ok ? "Copied" : "Copy failed";
      button.classList.toggle("done", ok);
      setTimeout(() => { button.textContent = "Copy"; button.classList.remove("done"); }, 1600);
    });
    const toggle = h("button", { type: "button", class: "preview" }, "Raw");
    const raw = h("pre", { hidden: true }, value);
    const rendered = markdownView(value);
    toggle.addEventListener("click", (event) => {
      event.preventDefault();
      const showingRaw = toggle.classList.toggle("on");
      raw.hidden = !showingRaw;
      rendered.hidden = showingRaw;
      toggle.textContent = showingRaw ? "Preview" : "Raw";
    });
    return h("div", { class: "paste" }, h("div", { class: "bar" }, h("span", { class: "label" }, label), h("span", { class: "actions" }, toggle, button)), raw, rendered);
  };

  const field = (key, value) => (value ? h("p", {}, h("span", { class: "k" }, key), value) : null);

  // A card with nothing behind it is a plain row: no chevron, nothing to expand.
  const item = (cls, open, id, summaryParts, bodyParts) => {
    const body = [bodyParts].flat(Infinity).filter((part) => part !== undefined && part !== null && part !== false && part !== "");
    return body.length
      ? h("details", { class: `item ${cls}`, open: open ? "" : null, id }, h("summary", {}, summaryParts), h("div", { class: "body" }, body))
      : h("div", { class: `row-static ${cls}`, id }, summaryParts);
  };

  // show-me's text views (call tree, file tree, pseudocode, code): "  # " or "  // " starts a dim comment, a leading "!" marks a hot line.
  const commentAt = (line) => [line.indexOf("  # "), line.indexOf("  // "), /^\s*\/\//.test(line) ? 0 : -1].filter((at) => at !== -1).reduce((first, at) => Math.min(first, at), Infinity);
  const textView = (source) => h("div", { class: "tree" }, h("pre", {}, String(source).split("\n").flatMap((raw) => {
    const hot = raw.startsWith("!");
    const line = hot ? raw.slice(1) : raw;
    const found = commentAt(line);
    const at = found === Infinity ? -1 : found;
    const code = at === -1 ? line : line.slice(0, at);
    const comment = at === -1 ? null : h("span", { class: "cm" }, line.slice(at));
    return [h("span", { class: hot ? "hot" : null }, code), comment, "\n"];
  })));

  const scenarioStrip = (steps) => h("div", { class: "scenario" }, steps.flatMap((step, i) => [
    i ? h("span", { class: "arrow" }, "→") : null,
    h("div", { class: `step${i === steps.length - 1 ? " bad" : ""}` }, h("span", { class: "n" }, i === steps.length - 1 ? "result" : `${i + 1}`), step)
  ]));

  // A unified-diff-style block: "+" lines added, "-" lines removed, anything else context.
  const diffBlock = (source) => h("div", { class: "diff" }, String(source).split("\n").map((line) =>
    h("div", { class: line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : null }, line)));

  const evidenceList = (rows, head) => h("ul", { class: "evidence" }, rows.map((row) => h("li", {}, row.anchor ? anchorLink(row.anchor, head) : h("span", { class: "src" }, row.source || ""), h("span", {}, row.fact))));

  const section = (id, title, sub, ...body) => ({ id, title, node: h("section", { id }, h("h2", {}, title), sub ? h("p", { class: "sub" }, sub) : null, ...body) });

  const table = (heads, rows) => h("table", {}, h("thead", {}, h("tr", {}, heads.map((head) => h("th", {}, head)))), h("tbody", {}, rows.map((row) => h("tr", {}, row.map((cell) => h("td", {}, cell))))));

  const filterBar = (options, onPick) => {
    const buttons = options.map(([value, label], i) => h("button", { type: "button", class: i === 0 ? "on" : "" }, label));
    buttons.forEach((button, i) => button.addEventListener("click", () => {
      buttons.forEach((other) => other.classList.toggle("on", other === button));
      onPick(options[i][0]);
    }));
    return h("div", { class: "filters" }, buttons);
  };

  const renderHeader = (subtitle) => {
    const { pr, stack } = DATA;
    const verdict = VERDICTS[DATA.verdict];
    return h("header", { class: "page" },
      h("div", { class: "eyebrow" }, `PR #${pr.number}${pr.repo ? ` · ${pr.repo}` : ""}${subtitle ? ` · ${subtitle}` : ""}`),
      h("h1", {}, pr.title),
      h("div", { class: "chips" },
        verdict ? h("span", { class: `chip ${verdict[1]}` }, verdict[0]) : null,
        DATA.draft ? h("span", { class: "chip warn" }, "draft: quick or partial, gates not run") : null,
        DATA.risk ? h("span", { class: "chip" }, `risk ${DATA.risk}`) : null,
        h("span", { class: "chip" }, `@${pr.author}`),
        h("span", { class: "chip" }, `${pr.head} → ${pr.base}`),
        pr.adds !== undefined ? h("span", { class: "chip" }, `+${pr.adds} / −${pr.dels ?? 0}`) : null,
        DATA.executed && DATA.executed.length <= 24 ? h("span", { class: "chip" }, `executed: ${DATA.executed}`) : null),
      h("p", { class: "lede" }, DATA.summary),
      DATA.riskWhy ? h("p", { class: "riskwhy" }, `Risk ${DATA.risk}: ${DATA.riskWhy}`) : null,
      DATA.executed && DATA.executed.length > 24 ? h("p", { class: "riskwhy" }, `Executed: ${DATA.executed}`) : null,
      list(stack).length ? h("div", { class: "stack" },
        stack.flatMap((layer, i) => [
          i ? h("span", { class: "arrow" }, "→") : null,
          h("span", { class: `layer${layer.current ? " current" : ""}`, title: layer.title }, `#${layer.number} ${layer.title}`)
        ])) : null);
  };

  const checksTable = () => list(DATA.checks).length
    ? section("checks", "Checks run", null, h("div", { class: "card" }, table(["Check", "Result", "Notes"],
        DATA.checks.map((row) => [row.check, h("span", { class: `pill ${row.result}` }, row.result), row.notes || ""]))))
    : null;

  const textList = (id, title, sub, items) => list(items).length
    ? section(id, title, sub, h("div", { class: "card" }, h("ul", { class: "plain" }, items.map((entry) => h("li", {}, entry)))))
    : null;

  const priorSection = () => (list(DATA.sinceLast).length || list(DATA.prior).length)
    ? section("prior", "Prior context", null, h("div", { class: "card" },
        list(DATA.sinceLast).length ? [h("h3", { style: "margin-top:0" }, "Since the last run"), h("ul", { class: "plain" }, DATA.sinceLast.map((entry) => h("li", {}, entry)))] : null,
        list(DATA.prior).length ? h("ul", { class: "plain" }, DATA.prior.map((entry) => h("li", {}, entry))) : null))
    : null;

  // ---------- review ----------

  // Signal first. A point someone already raised, whose thread still stands, and a test or lint finding sit lower and collapsed;
  // a reply that corrects a partly fixed or wrong thread stays up top, and a blocker never moves. pr-report.ts orders ids the same way.
  const threadStates = Object.fromEntries(list(DATA.conversation).filter((thread) => thread.url).map((thread) => [thread.url, thread.state]));
  const replied = (finding) => Boolean(finding.raisedBy) && !["partly", "wrong"].includes(threadStates[finding.raisedBy.url]);
  const tierOf = (finding) => {
    if (finding.severity === "question") { return replied(finding) || finding.topic ? 5 : 4; }
    if (finding.severity === "blocker") { return 0; }
    if (finding.severity === "nit") { return 3; }
    return replied(finding) ? 1 : finding.topic ? 2 : 0;
  };
  const badgeOf = (finding) => (finding.severity === "blocker" ? null : replied(finding) ? "replied" : finding.topic || null);

  const findingCard = (finding, open, anchorId) => {
    const raised = finding.raisedBy;
    const visual = list(finding.scenario).length > 0;
    const badge = badgeOf(finding);
    return item(badge ? "nit" : finding.severity, open, anchorId,
      [h("span", { class: `pill ${badge || finding.severity}` }, badge || SEVERITY_LABEL[finding.severity]), h("span", { class: "meta" }, `#${finding.id}`), layerPill(finding.pr),
       h("span", { class: "title" }, finding.title), anchorLink(finding.anchor, layerHead(finding.pr)),
       raised ? link(raised.url, h("span", { class: "raised" }, replied(finding) ? `also raised by @${raised.who}` : `follow-up on @${raised.who}'s thread`)) : null],
      [visual ? [h("div", { class: "lbl" }, "What goes wrong"), scenarioStrip(finding.scenario)] : finding.diagram ? h("div", { class: "lbl" }, "What goes wrong") : field("Failure", finding.failure),
       finding.diagram ? h("div", { class: "diagram" }, h("pre", {}, finding.diagram)) : null,
       finding.snippet ? [h("div", { class: "lbl" }, "The code"), h("div", { class: "snippet" }, h("pre", {}, finding.snippet))] : null,
       list(finding.proof).length ? [h("div", { class: "lbl" }, "Evidence"), evidenceList(finding.proof, layerHead(finding.pr))] : field("Evidence", finding.evidence),
       h("div", { class: "finding-meta" }, [list(finding.lanes).join(", "), finding.principle, finding.introduced ? `introduced: ${finding.introduced}` : null].filter(Boolean).join(" · ")),
       paste(pasteLabel(finding), finding.comment)]);
  };

  const pasteLabel = (finding) => {
    const raised = finding.raisedBy;
    if (!STACKED) { return raised ? `Reply on @${raised.who}'s thread` : (finding.severity === "question" ? "Question to paste" : "Comment to paste"); }
    if (raised) { return [`Reply on @${raised.who}'s thread · `, link(raised.url, `#${prOfUrl(raised.url) || finding.pr} ↗`)]; }
    return [finding.severity === "question" ? "Question for " : "Comment for ", filesLink(finding.pr, finding.anchor, `#${finding.pr} ↗`)];
  };

  const reviewSections = () => {
    const findings = list(DATA.findings);
    const issues = findings.filter((finding) => finding.severity !== "question")
      .sort((a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity));
    const questions = findings.filter((finding) => finding.severity === "question");

    const look = section("look", "Where to look", "The hunks a human should read. The review lanes read everything else.",
      h("div", { class: "card" },
        h("ol", { class: "look" }, DATA.lookAt.map((entry) => h("li", {}, h("div", {}, anchorLink(entry.anchor), h("div", {}, entry.why))))),
        DATA.skim ? h("div", { class: "skim" }, "Skim · ", DATA.skim) : null),
      list(DATA.decisions).length ? h("div", { class: "card" }, h("h3", {}, "Decisions this PR makes for you"),
        table(["Decision", "Picks", "Where"], DATA.decisions.map((row) => [row.decision, row.picks, anchorLink(row.anchor)]))) : null,
      list(DATA.asked).length ? h("div", { class: "card" }, h("h3", {}, "Asked vs delivered"),
        table(["Criterion", "Status", "Where"], DATA.asked.map((row) => [row.criterion, h("span", { class: `pill ${row.status}` }, row.status.replace(/-/g, " ")), row.anchor ? anchorLink(row.anchor) : ""]))) : null);

    const how = section("how", "How it works", null,
      DATA.callTree ? h("div", { class: "card" }, h("div", { class: "lbl" }, DATA.callTree.title), textView(DATA.callTree.text)) : null,
      !DATA.callTree && DATA.explanation ? h("p", { class: "prose" }, DATA.explanation) : null,
      list(DATA.flows).length ? h("div", { class: "grid" }, DATA.flows.map((flow) => h("div", { class: "card" },
        h("h3", { style: "margin-top:0" }, flow.title),
        h("div", { class: "diagram" }, h("pre", {}, flow.diagram)),
        list(flow.steps).length ? h("ol", { class: "steps" }, flow.steps.map((step) => h("li", {}, step.anchor ? [anchorLink(step.anchor), " "] : null, step.text))) : null))) : null,
      DATA.walkTree ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Walkthrough"),
        DATA.walkTree.sub ? h("p", { class: "sub" }, DATA.walkTree.sub) : null, textView(DATA.walkTree.text))
        : null,
      list(DATA.behavior).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Before and after: what changes when this merges"),
        h("p", { class: "sub" }, `Each row is one situation: what happens on ${DATA.pr.base} today, then what happens with this PR. Red marks a defect the PR introduces.`),
        h("div", { class: "ba" }, DATA.behavior.map((row) => {
          const isNew = !row.before || row.before === "—";
          return h("div", { class: "case" }, h("h4", {}, row.case),
            h("div", { class: "lines" },
              isNew ? null : h("div", { class: "line before" }, h("span", { class: "tag" }, "today"), h("span", {}, row.before)),
              h("div", { class: `line after ${row.bad ? "bad" : "good"}` }, h("span", { class: "tag" }, isNew ? "new path" : "this PR"), h("span", {}, row.after)),
              row.diff ? diffBlock(row.diff) : null));
        })))
        : null,
      list(DATA.holdQuestions).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Questions to hold in your head"),
        h("ul", { class: "plain" }, DATA.holdQuestions.map((entry) => h("li", {}, entry)))) : null);

    const against = DATA.caseAgainst ? section("against", "Case against", null, h("div", { class: "grid three" },
      [["Strongest argument against merging", DATA.caseAgainst.strongest], ["Most likely to bite in three months", DATA.caseAgainst.threeMonths], ["If 40% had to go", DATA.caseAgainst.cut]]
        .map(([label, value]) => h("div", { class: "card against" }, h("div", { class: "label" }, label), h("div", {}, value))))) : null;

    const GROUP_HEAD = { 1: "Already raised on the PR: a reply on their thread", 2: "Tests and lint", 3: "Nits", 5: "Already raised, or about tests and lint" };
    const grouped = (rows) => [...rows]
      .sort((a, b) => tierOf(a) - tierOf(b) || a.id - b.id)
      .flatMap((finding, index, sorted) => {
        const tier = tierOf(finding);
        const head = (index === 0 || tierOf(sorted[index - 1]) !== tier) && GROUP_HEAD[tier] ? h("div", { class: "group-head" }, GROUP_HEAD[tier]) : null;
        const card = findingCard(finding, tier === 0, `finding-${finding.id}`);
        if (STACKED) { card.dataset.pr = finding.pr; }
        return [head, card];
      });
    const filtered = (rows) => {
      const box = h("div", {}, grouped(rows));
      return [layerFilter(box, (finding) => finding.pr, rows), box];
    };

    const findingsSection = section("findings", "Findings", issues.length ? (STACKED ? "Open a card for the evidence and the comment to paste. The PR badge says which PR in the stack it goes on." : "Open a card for the evidence and the comment to paste on that line.") : null,
      issues.length ? filtered(issues) : h("p", { class: "empty" }, "No findings."));

    const questionsSection = questions.length ? section("questions", "Questions for the author", "Real but unproven: asked, not asserted.",
      filtered(questions)) : null;

    const statStrip = (stats) => h("div", { class: "stats" }, stats.map(([value, label, tone]) => h("div", { class: `stat ${tone}` }, h("b", {}, String(value)), h("span", {}, label))));

    const since = DATA.sinceReview ? (() => {
      const review = DATA.sinceReview;
      const status = (name) => list(review.findings).filter((row) => row.status === name).length;
      return section("since", "Since last review", review.sub || `Against the review of ${review.prior}.`,
        statStrip([[status("fixed"), "fixed", "ok"], [status("changed"), "changed", "warn"], [status("open"), "still open", "bad"], [findings.filter((finding) => finding.priorId === undefined).length, "new", "cool"]]),
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, `Last review's findings (${review.prior})`),
          table(["Was", "Status at head", "Now"], list(review.findings).map((row) => [
            h("span", {}, h("span", { class: "meta mono" }, `#${row.id} `), row.title),
            h("span", { class: `pill ${row.status}` }, row.status),
            h("span", {}, row.anchor ? [anchorLink(row.anchor), " "] : null, row.now)]))),
        list(review.commits).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Commits since the reviewed head"),
          textView(review.commits.map((commit) => `${commit.sha}  ${commit.subject}`).join("\n"))) : null,
        list(review.conversation).length ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Conversation since"),
          h("ul", { class: "plain" }, review.conversation.map((entry) => h("li", {}, entry)))) : null);
    })() : null;

    const description = DATA.description ? (() => {
      const desc = DATA.description;
      const counts = ["matches", "partly", "wrong", "missing"].map((status) => [status, list(desc.claims).filter((claim) => claim.status === status).length]);
      const claimRows = h("div", {});
      const drawClaims = (filter) => {
        claimRows.replaceChildren(table(["The description says", "The code at head", ""],
          list(desc.claims).filter((claim) => filter === "all" || claim.status === filter || (filter === "off" && claim.status !== "matches"))
            .map((claim) => [claim.claim, h("span", {}, claim.code, claim.anchor ? [" ", anchorLink(claim.anchor)] : null), h("span", { class: `pill ${claim.status}` }, claim.status === "missing" ? "missing from body" : claim.status)])));
      };
      drawClaims("off");
      return section("description", "The PR description", "What the PR says it does, checked claim by claim against the code at the head.",
        desc.picture ? h("div", { class: "card" }, h("div", { class: "lbl" }, desc.picture.title), textView(desc.picture.text)) : null,
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Does it match the code?"),
          statStrip(counts.map(([status, value]) => [value, status === "missing" ? "missing from body" : status, { matches: "ok", partly: "warn", wrong: "bad", missing: "cool" }[status]])),
          filterBar([["off", "needs a change"], ["all", `all ${list(desc.claims).length}`]], drawClaims), claimRows),
        desc.proposed ? h("details", { class: "more" },
          h("summary", {}, `Proposed description to paste · ${desc.proposed.split("\n").length} lines`),
          h("p", { class: "sub", style: "margin:12px 0 0" }, "The description the PR should merge with, accurate to the head. It's the record people and agents read later."),
          paste("Markdown for the PR body", desc.proposed)) : null);
    })() : null;

    const architecture = DATA.architecture ? (() => {
      const arch = DATA.architecture;
      return section("architecture", "Architecture", arch.sub,
        arch.decision ? h("div", { class: "attn" }, h("b", {}, "Decision for you: "), arch.decision) : null,
        arch.components ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, arch.components.title), h("div", { class: "diagram" }, h("pre", {}, arch.components.diagram)), arch.components.caption ? h("p", { class: "sub", style: "margin:8px 0 0" }, arch.components.caption) : null) : null,
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, arch.today.title),
          statStrip(list(arch.stats).map((stat) => [stat.value, stat.label, stat.tone || ""])),
          h("div", { class: "diagram" }, h("pre", {}, arch.today.diagram)),
          arch.today.caption ? h("p", { class: "sub", style: "margin:8px 0 0" }, arch.today.caption) : null),
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Each concern: where it lives, where it should"),
          table(["Concern", "Today", "Recommended", "Reuses"], list(arch.concerns).map((row) => [
            h("b", {}, row.concern),
            h("span", {}, h("span", { class: `pill ${row.ok ? "matches" : "wrong"}` }, row.state), " ", row.today, row.anchor ? [" ", anchorLink(row.anchor)] : null),
            row.recommended, h("span", { class: "mono" }, row.reuses)]))),
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, arch.target.title),
          h("div", { class: "diagram" }, h("pre", {}, arch.target.diagram)),
          arch.target.caption ? h("p", { class: "sub", style: "margin:8px 0 0" }, arch.target.caption) : null),
        arch.mapping ? h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, arch.mapping.title || "How it maps onto the target"),
          arch.mapping.sub ? h("p", { class: "sub" }, arch.mapping.sub) : null, textView(arch.mapping.text)) : null,
        list(arch.comparisons).map((pair) => h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, pair.title),
          pair.sub ? h("p", { class: "sub" }, pair.sub) : null,
          // Short lines (file trees) read best side by side; code reads best stacked at full width.
          h("div", { class: Math.max(...[pair.today.text, pair.target.text].flatMap((text) => text.split("\n").map((line) => line.length))) <= 64 ? "compare side" : "compare" },
            [pair.today, pair.target].map((view) => h("div", {}, h("div", { class: "lbl" }, view.title), textView(view.text)))))),
        h("div", { class: "grid", style: "grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))" },
          h("div", { class: "card" }, h("h3", { style: "margin-top:0;color:var(--risk)" }, "Debt this PR adds"), h("ul", { class: "plain" }, list(arch.debt.adds).map((entry) => h("li", {}, entry)))),
          h("div", { class: "card" }, h("h3", { style: "margin-top:0;color:var(--ok)" }, "Debt it could pay down instead"), h("ul", { class: "plain" }, list(arch.debt.paysDown).map((entry) => h("li", {}, entry))))),
        h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Path"),
          h("ol", { class: "look" }, list(arch.path).map((step) => h("li", {}, h("div", {}, h("b", {}, step.step), h("div", { class: "sub", style: "margin:2px 0 0" }, step.what)))))));
    })() : null;

    const conversation = list(DATA.conversation).length ? (() => {
      const threads = DATA.conversation;
      const unanswered = threads.filter((thread) => thread.state === "unanswered");
      const rows = h("div", {});
      const view = { filter: "open", layer: "all" };
      const draw = (filter = view.filter, layer = view.layer) => {
        Object.assign(view, { filter, layer });
        rows.replaceChildren();
        const shown = threads
          .filter((thread) => layer === "all" || prOfUrl(thread.url) === layer)
          .filter((thread) => filter === "all" || (filter === "people" && thread.kind !== "bot") || (filter === "bots" && thread.kind === "bot") || (filter === "open" && ["open", "partly", "unanswered"].includes(thread.state)));
        shown.forEach((thread) => rows.append(item(thread.state === "open" ? "risk" : thread.state === "fixed" || thread.state === "answered" ? "mechanical" : "logic", false, null,
          [h("span", { class: `pill ${thread.state}` }, thread.state === "wrong" ? "doesn't hold" : thread.state), h("span", { class: "meta" }, `@${thread.who}`),
           h("span", { class: "title" }, thread.point), thread.anchor ? anchorLink(thread.anchor) : null,
           thread.finding ? h("a", { href: `#finding-${thread.finding}`, class: "meta" }, `→ our #${thread.finding}`) : null,
           thread.url ? link(thread.url, STACKED ? h("span", { class: "pill layer" }, `PR #${prOfUrl(thread.url)} ↗`) : h("span", { class: "meta" }, "thread ↗")) : null],
          [thread.note ? h("p", {}, thread.note) : null,
           thread.reply ? paste(STACKED ? ["Reply on the thread · ", link(thread.url, `#${prOfUrl(thread.url)} ↗`)] : "Reply to paste on the thread", thread.reply) : null])));
        if (!shown.length) { rows.append(h("p", { class: "empty" }, "Nothing in this view.")); }
      };
      draw();
      const count = (pred) => threads.filter(pred).length;
      return section("conversation", "Review conversation", "Every thread on the PR, people and bots, checked against the head. A point someone already raised becomes a reply on their thread, never a second comment.",
        unanswered.length ? h("div", { class: "attn" }, h("b", {}, "Waiting on the author: "), unanswered.map((thread) => `@${thread.who}: ${thread.point}`).join(" · ")) : null,
        filterBar([["open", `open ${count((thread) => ["open", "partly", "unanswered"].includes(thread.state))}`], ["all", `all ${threads.length}`], ["people", `people ${count((thread) => thread.kind !== "bot")}`], ["bots", `bots ${count((thread) => thread.kind === "bot")}`]], (filter) => draw(filter)),
        STACKED ? filterBar([["all", "all PRs"], ...DATA.stack.map((layer) => [layer.number, `#${layer.number} ${count((thread) => prOfUrl(thread.url) === layer.number)}`])], (layer) => draw(undefined, layer)) : null,
        rows);
    })() : null;

    const fileList = h("div", {});
    const drawFiles = (filter) => {
      fileList.replaceChildren();
      const files = DATA.files.filter((file) => filter === "all" || file.class === filter);
      [...new Set(files.map((file) => file.concern))].forEach((concern) => fileList.append(h("div", { class: "concern" },
        h("div", { class: "name" }, concern),
        files.filter((file) => file.concern === concern).map((file) => {
          const cards = findings.filter((finding) => pathOf(finding.anchor) === file.path);
          return item(file.class, cards.length > 0, null,
            [h("span", { class: `pill ${file.class}` }, file.class), h("span", { class: "fileline" }, h("code", {}, file.path), h("span", { class: "desc" }, file.summary)),
             cards.length ? h("span", { class: "meta" }, `${cards.length} comment${cards.length > 1 ? "s" : ""}`) : null,
             file.adds !== undefined ? h("span", { class: "meta" }, `+${file.adds} −${file.dels ?? 0}`) : null],
            [list(file.hunks).length ? h("ul", { class: "plain" }, file.hunks.map((hunk) => h("li", {}, anchorLink(`${file.path}:${hunk.lines}`), " ", hunk.text))) : null,
             cards.length ? h("div", { class: "nested" }, cards.map((finding) => findingCard(finding, false, null))) : null]);
        }))));
    };
    const drawFilesOrEmpty = (filter) => {
      drawFiles(filter);
      if (!fileList.children.length) { fileList.append(h("p", { class: "empty" }, "No files in this view.")); }
    };
    drawFilesOrEmpty("all");
    const counts = Object.fromEntries(CLASSES.map((cls) => [cls, DATA.files.filter((file) => file.class === cls).length]));
    const files = section("files", "File map", "Every file, grouped by concern, with the comments anchored in it.",
      filterBar([["all", `all ${DATA.files.length}`], ...CLASSES.map((cls) => [cls, `${cls} ${counts[cls]}`])], drawFilesOrEmpty), fileList);

    const clean = textList("clean", "Verified clean", "What was checked and found right.", DATA.verifiedClean);
    const summary = DATA.summaryComment ? section("summary", "Summary comment", "Optional top-level comment for the PR conversation.", paste("Summary to paste", DATA.summaryComment)) : null;
    const noticed = list(DATA.noticed).length ? section("noticed", "Noticed, not this PR's problem", null,
      h("div", { class: "card" }, h("ul", { class: "plain" }, DATA.noticed.map((entry) => h("li", {}, anchorLink(entry.anchor), " ", entry.text))))) : null;
    const dropped = list(DATA.dropped).length ? section("dropped", "Dropped after verification", "Rescue one if the reason is wrong.",
      item("mechanical", false, null, [h("span", { class: "title" }, `${DATA.dropped.length} candidates dropped`)],
        [h("ul", { class: "plain" }, DATA.dropped.map((entry) => h("li", {}, anchorLink(entry.anchor), ` · ${[list(entry.lanes).join(", "), entry.claim].filter(Boolean).join(": ")} · dropped because ${entry.reason}`)))])) : null;
    const notChecked = textList("not-checked", "Not checked", null, DATA.notChecked);

    // Understand the PR, then judge it, then act on it; reference material last. A re-review's delta sits right above the findings it explains.
    const groups = [
      [description, how, architecture],
      [look, since, findingsSection, questionsSection, against],
      [conversation, summary],
      [files, clean, checksTable(), noticed, dropped, notChecked, since ? null : priorSection()]
    ];
    const placed = groups.flatMap((group, i) => group.filter(Boolean).map((entry) => ({ ...entry, group: i })));
    return placed.map((entry, k) => ({ ...entry, groupStart: k > 0 && entry.group !== placed[k - 1].group }));
  };

  // ---------- replies ----------

  const WHERE_TITLE = { inline: "Inline threads", conversation: "Conversation", review: "Review bodies" };

  const threadCard = (thread) => item(thread.status, thread.status !== "posted", null,
    [h("span", { class: `pill ${thread.status}` }, STATUS_LABEL[thread.status]), h("span", { class: "title" }, thread.point),
     h("span", { class: "meta" }, thread.reviewer), thread.bot ? h("span", { class: "pill bot" }, "bot") : null,
     thread.anchor ? anchorLink(thread.anchor) : null, thread.outdated ? h("span", { class: "meta" }, "outdated") : null],
    [h("p", { class: "quote" }, `${thread.reviewer} wrote: “${thread.quote}”`),
     thread.reply ? paste(thread.status === "follow-up" ? "Follow-up to paste" : "Reply to paste", thread.reply) : h("p", { class: "empty" }, "Nothing new."),
     h("p", {}, link(thread.url, `Open thread ${thread.id} ↗`))]);

  const repliesSections = () => {
    const threads = list(DATA.threads);
    const prOfThread = (thread) => thread.pr ?? DATA.pr.number;
    const prs = [...new Set(threads.map(prOfThread))];
    const threadList = h("div", {});
    const drawThreads = (filter) => {
      threadList.replaceChildren();
      const shown = threads.filter((thread) => filter === "all" || thread.status === filter);
      const groups = prs.length > 1 ? prs.map((pr) => [`#${pr}`, shown.filter((thread) => prOfThread(thread) === pr)]) : [[null, shown]];
      groups.forEach(([prLabel, group]) => {
        if (prLabel && group.length) { threadList.append(h("h3", {}, prLabel)); }
        ["inline", "conversation", "review"].forEach((where) => {
          const inWhere = group.filter((thread) => thread.where === where);
          if (inWhere.length) { threadList.append(h("div", { class: "concern" }, h("div", { class: "name" }, WHERE_TITLE[where]), inWhere.map(threadCard))); }
        });
      });
      if (!shown.length) { threadList.append(h("p", { class: "empty" }, "No threads in this view.")); }
    };
    drawThreads("all");
    const count = (status) => threads.filter((thread) => thread.status === status).length;
    const threadsSection = section("threads", "Threads", "In PR scroll order. Paste each reply on the thread it links to.",
      filterBar([["all", `all ${threads.length}`], ["to-post", `to post ${count("to-post")}`], ["follow-up", `follow-up ${count("follow-up")}`], ["posted", `posted ${count("posted")}`]], drawThreads),
      threadList);

    const own = list(DATA.ownFindings).length ? section("own", "Found on my own", "From the self-pass over the diff.",
      DATA.ownFindings.map((finding) => item("fix-before-merge", true, null,
        [h("span", { class: "title" }, finding.title), anchorLink(finding.anchor)],
        [h("p", {}, finding.detail), finding.comment ? paste("Comment to leave on the line", finding.comment) : null]))) : null;
    const commits = list(DATA.commits).length ? section("commits", "Suggested commits", "One per group of related fixes; you commit.",
      DATA.commits.map((commit) => paste("Commit message", commit.body ? `${commit.subject}\n\n${commit.body}` : commit.subject))) : null;
    const resolve = list(DATA.resolveOnly).length ? section("resolve", "Just needs Resolve", null,
      h("div", { class: "card" }, h("ul", { class: "plain" }, DATA.resolveOnly.map((entry) => h("li", {}, entry.anchor ? [anchorLink(entry.anchor), " "] : null, `${entry.topic} — ${entry.why}`))))) : null;
    const open = textList("open", "Still open", null, DATA.stillOpen);
    return [threadsSection, own, commits, resolve, open, checksTable(), priorSection()];
  };

  // ---------- page ----------

  const sections = (DATA.kind === "replies" ? repliesSections() : reviewSections()).filter(Boolean);
  const root = document.getElementById("render");
  root.append(
    renderHeader(DATA.kind === "replies" ? "replies" : "review"),
    h("nav", { class: "jump" }, sections.flatMap((entry) => [entry.groupStart ? h("span", { class: "sep" }) : null, h("a", { href: `#${entry.id}` }, entry.title)])),
    ...sections.map((entry) => entry.node),
    h("footer", {}, "Rendered from the pr-report-data block in this file. Diagram sources show as text when the diagram library can't load."));
  document.title = `PR #${DATA.pr.number}${DATA.kind === "replies" ? " replies" : ""} — ${DATA.pr.title}`;


  let mermaidLib = null;
  // A theme flip mid-draw starts a new run; the older run's late results are dropped.
  let generation = 0;
  const drawDiagrams = async () => {
    if (!mermaidLib) { return; }
    const run = ++generation;
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    mermaidLib.initialize({ startOnLoad: false, securityLevel: "strict", suppressErrorRendering: true, theme: dark ? "dark" : "default" });
    const boxes = [...document.querySelectorAll(".diagram")];
    await Promise.all(boxes.map(async (box, i) => {
      const source = box.dataset.source || box.textContent;
      box.dataset.source = source;
      try {
        const { svg } = await mermaidLib.render(`diagram-${i}-${Date.now()}`, source);
        if (run !== generation) { return; }
        box.innerHTML = svg;
      } catch (err) {
        if (run !== generation) { return; }
        box.replaceChildren(h("pre", {}, source));
      }
    }));
  };
  if (document.querySelector(".diagram")) {
    window.__renderDone = false;
    import("https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs")
      .then((module) => { mermaidLib = module.default; return drawDiagrams(); })
      .catch(() => {})
      .finally(() => { window.__renderDone = true; });
  }

  document.addEventListener("themechange", drawDiagrams);
</script>
</body>
</html>
