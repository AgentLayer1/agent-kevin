<script>
(() => {
  const KEY = "agent-theme";
  const CHOICES = {
    auto: ["Auto, follows the system", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='6' fill='none' stroke='currentColor' stroke-width='1.5'/><path d='M8 2a6 6 0 0 1 0 12z' fill='currentColor'/></svg>"],
    light: ["Light", "<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='3' fill='currentColor'/><path d='M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'/></svg>"],
    dark: ["Dark", "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M13.5 10.2A5.8 5.8 0 0 1 5.8 2.5a5.8 5.8 0 1 0 7.7 7.7z' fill='currentColor'/></svg>"],
  };
  const root = document.documentElement;
  const media = matchMedia("(prefers-color-scheme: dark)");
  const read = () => { try { const saved = localStorage.getItem(KEY); return Object.hasOwn(CHOICES, saved) ? saved : "auto"; } catch (e) { return "auto"; } };
  let choice = read();
  const apply = () => {
    const mode = choice === "auto" ? (media.matches ? "dark" : "light") : choice;
    const changed = root.getAttribute("data-theme") !== mode;
    root.setAttribute("data-theme", mode);
    root.style.colorScheme = mode;
    document.querySelectorAll(".theme-switch button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.choice === choice)));
    if (changed) { document.dispatchEvent(new CustomEvent("themechange", { detail: { mode } })); }
  };
  const choose = (next) => {
    choice = next;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    apply();
  };
  const mount = () => {
    const slot = document.getElementById("theme-slot");
    const group = document.createElement("div");
    group.className = slot ? "theme-switch" : "theme-switch floating";
    group.setAttribute("role", "group");
    group.setAttribute("aria-label", "Theme");
    Object.entries(CHOICES).forEach(([name, [label, icon]]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.choice = name;
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = icon;
      button.addEventListener("click", () => choose(name));
      group.append(button);
    });
    (slot || document.body).append(group);
    if (!slot) { mountToTop(); }
    apply();
  };
  // Pages with a floating switch are long reads; a slotted switch sits in an app header that has its own navigation.
  const mountToTop = () => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "to-top";
    button.title = "Back to top";
    button.setAttribute("aria-label", "Back to top");
    button.innerHTML = "<svg viewBox='0 0 16 16' aria-hidden='true'><path d='M8 13V3M3.5 7.5 8 3l4.5 4.5' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>";
    button.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    const show = () => {
      const shown = window.scrollY > window.innerHeight / 2;
      button.classList.toggle("shown", shown);
      button.tabIndex = shown ? 0 : -1;
    };
    window.addEventListener("scroll", show, { passive: true });
    document.body.append(button);
    show();
  };
  media.addEventListener("change", () => { if (choice === "auto") { apply(); } });
  window.addEventListener("storage", (event) => { if (event.key === KEY) { choice = read(); apply(); } });
  apply();
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", mount); } else { mount(); }
})();

    {
      "number": 44, "title": "Add tags to notes", "url": "https://github.com/acme/app/pull/44", "author": "alice", "mine": true, "draft": false, "mergeable": "CONFLICTING", "reviewDecision": "APPROVED", "review": "none",
      "next": "Merge main, renumber the migration, push.", "owed": []
    }
  ],
  "promises": [{ "ref": "#44", "url": "https://github.com/acme/app/pull/44#issuecomment-1", "to": "bob", "at": "2026-10-20T10:00:00Z", "promise": "Open a follow-up issue for renaming a tag that notes still use.", "status": "open", "evidence": "No issue found.", "confidence": "confirmed" }],
  "quiet": [{ "ref": "#38", "note": "Draft; no comments." }],
  "notChecked": ["CI status: the token can't read checks."]
}
</script>

<script>
  const DATA = JSON.parse(document.getElementById("sweep-report-data").textContent);
  const list = (value) => (Array.isArray(value) ? value : []);
  const STORE = `sweep:${DATA.repo}:`;
  const WHERE = { inline: "inline", conversation: "conversation", review: "review body", issue: "issue" };
  const REVIEW = { owed: ["review owed", "bad"], "re-review": ["re-review", "warn"], pending: ["pending: submit it", "bad"] };

  // Every string comes from GitHub or the model: nodes are built from text, never from markup.
  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([key, val]) => {
      if (val === undefined || val === null || val === false) { return; }
      if (key === "class") { node.className = val; } else { node.setAttribute(key, String(val)); }
    });
    children.flat().filter((child) => child !== undefined && child !== null && child !== false && child !== "")
      .forEach((child) => node.append(child instanceof Node ? child : document.createTextNode(String(child))));
    return node;
  };

  const link = (url, ...children) =>
    /^https:\/\//.test(url || "") ? h("a", { href: url, target: "_blank", rel: "noopener" }, ...children) : h("span", {}, ...children);

  const when = (iso) => {
    const date = new Date(iso);
    return Number.isNaN(date.getTime()) ? iso : date.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  };

  const stored = (id) => { try { return localStorage.getItem(STORE + id) === "1"; } catch (e) { return false; } };
  const store = (id, done) => { try { if (done) { localStorage.setItem(STORE + id, "1"); } else { localStorage.removeItem(STORE + id); } } catch (e) {} };

  const copyText = async (value) => {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch (err) {
      const area = h("textarea", { style: "position:fixed;opacity:0" });
      area.value = value;
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    }
  };

  const inline = (text) => {
    const parts = [];
    let last = 0;
    [...String(text).matchAll(/`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g)].forEach((match) => {
      parts.push(text.slice(last, match.index));
      parts.push(match[1] !== undefined ? h("code", {}, match[1]) : match[2] !== undefined ? h("strong", {}, inline(match[2])) : link(match[4], inline(match[3])));
      last = match.index + match[0].length;
    });
    parts.push(text.slice(last));
    return parts.filter((part) => part !== "");
  };

  // The paste box opens on the text the way GitHub shows it; Raw shows the exact text Copy copies.
  const markdownView = (source) => {
    const root = h("div", { class: "md" });
    const lines = String(source).split("\n");
    const state = { paragraph: [], list: null };
    const endParagraph = () => {
      if (state.paragraph.length) { root.append(h("p", {}, state.paragraph.flatMap((line, i) => [i ? h("br", {}) : null, ...inline(line)]))); }
      state.paragraph = [];
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const fence = /^\s*```(\w*)\s*$/.exec(line);
      const item = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
      if (fence) {
        endParagraph(); state.list = null;
        const body = [];
        for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) { body.push(lines[i]); }
        root.append(h("pre", {}, h("code", {}, body.join("\n"))));
      } else if (item) {
        endParagraph();
        const ordered = /\d/.test(item[2]);
        if (!state.list || state.list.tagName !== (ordered ? "OL" : "UL")) { state.list = h(ordered ? "ol" : "ul", {}); root.append(state.list); }
        state.list.append(h("li", {}, inline(item[3])));
      } else if (!line.trim()) {
        endParagraph(); state.list = null;
      } else {
        state.list = null;
        state.paragraph.push(line);
      }
    }
    endParagraph();
    return root;
  };

  const paste = (label, value) => {
    const button = h("button", { type: "button", class: "copy" }, "Copy");
    button.addEventListener("click", async (event) => {
      event.preventDefault();
      const ok = await copyText(value);
      button.textContent = ok ? "Copied" : "Copy failed";
      button.classList.toggle("done", ok);
      setTimeout(() => { button.textContent = "Copy"; button.classList.remove("done"); }, 1600);
    });
    const toggle = h("button", { type: "button", class: "preview" }, "Raw");
    const raw = h("pre", { hidden: true }, value);
    const rendered = markdownView(value);
    toggle.addEventListener("click", (event) => {
      event.preventDefault();
      const showingRaw = toggle.classList.toggle("on");
      raw.hidden = !showingRaw;
      rendered.hidden = showingRaw;
      toggle.textContent = showingRaw ? "Preview" : "Raw";
    });
    return h("div", { class: "paste" }, h("div", { class: "bar" }, h("span", { class: "label" }, label), h("span", { class: "actions" }, toggle, button)), raw, rendered);
  };

  const pill = (cls, text) => h("span", { class: `pill ${cls}` }, text);
  const field = (key, value) => (value ? h("p", { class: "field" }, h("span", { class: "k" }, key), value) : null);

  const owedCard = (owed) => {
    const box = h("input", { type: "checkbox", title: "Handled", "aria-label": `Mark ${owed.who}'s comment handled` });
    const card = h("details", { class: `item${owed.kind === "bot" ? " bot" : ""}${owed.new ? " isnew" : ""}` },
      h("summary", {},
        h("span", { class: "who" }, owed.who),
        owed.new ? pill("new", "NEW") : null,
        owed.kind === "bot" ? pill("bot", "bot") : null,
        pill("", WHERE[owed.where] || owed.where),
        h("span", { class: "point" }, owed.point),
        h("span", { class: "meta" }, when(owed.at))),
      h("div", { class: "body" },
        owed.quote ? h("div", { class: "quote" }, `“${owed.quote}”`) : null,
        h("p", { class: "field" }, link(owed.url, "Open on GitHub ↗"), " ", pill(owed.confidence, owed.confidence)),
        owed.needsFirst ? h("div", { class: "needs" }, h("span", { class: "k" }, "Needs code first"), owed.needsFirst) : null,
        owed.reply ? paste("Reply", owed.reply) : null,
        field("Action", owed.action),
        field("Note", owed.note)));
    const row = h("div", { class: "owed", "data-id": owed.id, "data-who": owed.who, "data-kind": owed.kind, "data-new": owed.new ? "1" : "0" }, box, card);
    const set = (done) => { row.classList.toggle("handled", done); box.checked = done; if (done) { card.open = false; } };
    set(stored(owed.id));
    box.addEventListener("change", () => { store(owed.id, box.checked); set(box.checked); refresh(); });
    return row;
  };

  const owedList = (owed) => list(owed).map(owedCard);

  const countPill = () => h("span", { class: "pill count", "data-count": "1" });

  const prState = (pr) => [
    pr.draft ? pill("", "draft") : null,
    pr.mergeable === "CONFLICTING" ? pill("bad", "conflicts with main") : null,
    !pr.mine && REVIEW[pr.review] ? pill(REVIEW[pr.review][1], REVIEW[pr.review][0]) : null,
    pr.reviewDecision === "APPROVED" ? pill("ok", "approved") : pr.reviewDecision === "CHANGES_REQUESTED" ? pill("warn", "changes requested") : null,
    pr.mine ? null : pill("", pr.author)
  ];

  const prGroup = (pr, open) => h("details", { class: "grp", open: open ? "" : null, id: `pr-${pr.number}` },
    h("summary", {}, link(pr.url, `#${pr.number}`), h("span", { class: "title" }, pr.title), prState(pr), countPill()),
    h("div", { class: "inner" },
      pr.next ? h("p", { class: "next" }, h("span", { class: "k" }, "Next"), pr.next) : null,
      owedList(pr.owed),
      list(pr.owed).length ? null : h("p", { class: "empty" }, "No comments owed.")));

  const hasNew = (items) => items.some((entry) => list(entry.owed).some((owed) => owed.new));

  // Only sections that hold comments get a "left" count; First moves, the tables and Nothing owed never do.
  const section = (id, title, hint, open, counted, ...body) => h("details", { class: "sec", id, open: open ? "" : null },
    h("summary", {}, h("h2", {}, title), h("span", { class: "hint" }, hint), counted ? countPill() : null),
    h("div", { class: "inner" }, ...body));

  const table = (heads, rows) => h("table", {}, h("thead", {}, h("tr", {}, heads.map((head) => h("th", {}, head)))), h("tbody", {}, rows.map((row) => h("tr", {}, row.map((cell) => h("td", {}, cell))))));

  const PRS = new Map(list(DATA.prs).map((pr) => [pr.number, pr]));
  const ISSUES = new Map(list(DATA.issues).map((issue) => [issue.number, issue]));

  // Every PR and issue in the data gets a fold, so each #n in a ref jumps there; the small arrow beside it still opens GitHub.
  const jumpRefs = (ref) => {
    const parts = [];
    let last = 0;
    [...String(ref).matchAll(/#(\d+)/g)].forEach((match) => {
      const number = Number(match[1]);
      const fold = PRS.has(number) ? `pr-${number}` : ISSUES.has(number) ? `issue-${number}` : null;
      parts.push(ref.slice(last, match.index));
      if (fold) {
        const jump = h("a", { class: "jump", href: `#${fold}`, title: "Jump to it on this page" }, match[0]);
        jump.addEventListener("click", (event) => { event.preventDefault(); jumpTo(fold); });
        const out = link((PRS.get(number) || ISSUES.get(number)).url, "↗");
        out.className = "out";
        out.title = "Open on GitHub";
        parts.push(jump, out);
      } else {
        parts.push(match[0]);
      }
      last = match.index + match[0].length;
    });
    parts.push(ref.slice(last));
    return parts.filter((part) => part !== "");
  };

  // A PR sits under the first issue that links it; otherwise in exactly one of mine, reviews or teammates.
  const placed = new Set();
  const issueGroups = list(DATA.issues).map((issue) => {
    const prs = list(issue.prs).map((number) => PRS.get(number)).filter((pr) => pr && !placed.has(pr.number));
    prs.forEach((pr) => placed.add(pr.number));
    const strays = list(issue.prs).filter((number) => !PRS.has(number));
    return h("details", { class: "grp", id: `issue-${issue.number}`, open: hasNew([issue, ...prs]) ? "" : null },
      h("summary", {}, link(issue.url, `Issue #${issue.number}`), h("span", { class: "title" }, issue.title), prs.length ? pill("", `${prs.length} PR${prs.length === 1 ? "" : "s"}`) : null, hasNew([issue, ...prs]) ? pill("new", "NEW") : null, countPill()),
      h("div", { class: "inner" },
        h("p", { class: "status" }, issue.status, strays.length ? ` Also linked: ${strays.map((number) => `#${number}`).join(", ")}.` : ""),
        owedList(issue.owed),
        prs.map((pr) => prGroup(pr, false))));
  });
  const rest = list(DATA.prs).filter((pr) => !placed.has(pr.number));
  const mine = rest.filter((pr) => pr.mine);
  const reviews = rest.filter((pr) => !pr.mine && pr.review !== "none");
  const teammates = rest.filter((pr) => !pr.mine && pr.review === "none");

  const counts = (() => {
    const owed = [...list(DATA.issues), ...list(DATA.prs)].flatMap((entry) => list(entry.owed));
    const theirs = list(DATA.prs).filter((pr) => !pr.mine);
    return {
      owed: owed.length,
      fresh: owed.filter((entry) => entry.new).length,
      reviews: theirs.filter((pr) => pr.review === "owed" || pr.review === "re-review").length,
      pending: theirs.filter((pr) => pr.review === "pending").length,
      conflicts: list(DATA.conflicts).length,
      needsCode: list(DATA.needsCode).length
    };
  })();

  const stat = (cls, value, label) => h("div", { class: `stat ${value ? cls : ""}` }, h("div", { class: "v" }, value), h("div", { class: "l" }, label));

  const NO_FILTERS = { person: "all", people: false, fresh: false, hideHandled: false };
  const filters = { ...NO_FILTERS };
  const people = [...list(DATA.issues), ...list(DATA.prs)].flatMap((entry) => list(entry.owed))
    .reduce((tally, owed) => tally.set(owed.who, { kind: owed.kind, n: (tally.get(owed.who)?.n || 0) + 1 }), new Map());
  const personOrder = [...people.entries()].sort(([, a], [, b]) => (a.kind === b.kind ? b.n - a.n : a.kind === "person" ? -1 : 1));

  const toggles = [];
  const toggleButton = (label, key) => {
    const button = h("button", { type: "button", "data-filter": key }, label);
    toggles.push(button);
    button.addEventListener("click", () => { filters[key] = !filters[key]; button.classList.toggle("on", filters[key]); refresh(); });
    return button;
  };

  const personButtons = [["all", `everyone ${counts.owed}`], ...personOrder.map(([who, info]) => [who, `${who} ${info.n}`])].map(([value, label], i) => {
    const button = h("button", { type: "button", class: i === 0 ? "on" : "" }, label);
    button.addEventListener("click", () => { filters.person = value; personButtons.forEach((other) => other.classList.toggle("on", other === button)); refresh(); });
    return button;
  });

  const clearFilters = () => {
    Object.assign(filters, NO_FILTERS);
    personButtons.forEach((button, i) => button.classList.toggle("on", i === 0));
    toggles.forEach((button) => button.classList.remove("on"));
    refresh();
  };

  // Opens the fold and every fold around it, clears a filter that hides it, then scrolls it under the sticky toolbar and flashes it.
  const jumpTo = (id) => {
    const target = document.getElementById(id);
    if (!target) { return; }
    if (target.closest(".hidden")) { clearFilters(); }
    for (let node = target; node; node = node.parentElement?.closest("details")) { node.open = true; }
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    target.classList.remove("flash");
    void target.offsetWidth;
    target.classList.add("flash");
    history.replaceState(null, "", `#${id}`);
  };

  const setAll = (open) => document.querySelectorAll("details.sec, details.grp").forEach((node) => { node.open = open; });
  const action = (label, run) => { const button = h("button", { type: "button" }, label); button.addEventListener("click", run); return button; };

  const fill = h("div", { class: "fill" });
  const progressText = h("span", {});

  const visibleOwed = (row) =>
    (filters.person === "all" || row.dataset.who === filters.person) &&
    (!filters.people || row.dataset.kind === "person") &&
    (!filters.fresh || row.dataset.new === "1") &&
    (!filters.hideHandled || !row.classList.contains("handled"));

  const filtering = () => filters.person !== "all" || filters.people || filters.fresh || filters.hideHandled;

  // Counts show what's left (unhandled) under each fold; a filtered view hides folds with nothing left to show.
  function refresh() {
    const rows = [...document.querySelectorAll(".owed")];
    rows.forEach((row) => row.classList.toggle("hidden", !visibleOwed(row)));
    document.querySelectorAll("details.grp, details.sec").forEach((fold) => {
      const inside = [...fold.querySelectorAll(".owed")];
      const left = inside.filter((row) => !row.classList.contains("handled")).length;
      const shown = inside.filter((row) => !row.classList.contains("hidden")).length;
      const pillNode = fold.querySelector(":scope > summary > [data-count]");
      if (pillNode) { pillNode.textContent = inside.length ? `${left} of ${inside.length} left` : "nothing owed"; pillNode.classList.toggle("zero", !left); }
      if (fold.classList.contains("grp")) { fold.classList.toggle("hidden", filtering() && shown === 0); }
    });
    const done = rows.filter((row) => row.classList.contains("handled")).length;
    progressText.textContent = `${done} of ${rows.length} handled`;
    fill.style.width = rows.length ? `${Math.round((done / rows.length) * 100)}%` : "100%";
  }

  const sinceLine = DATA.since ? ` · ${counts.fresh} new since ${when(DATA.since)}` : " · first sweep";
  const PROMISE_TONE = { open: "warn", wrong: "bad", superseded: "zero", done: "ok" };
  const PROMISE_ORDER = { wrong: 0, open: 1, superseded: 2, done: 3 };
  const promises = list(DATA.promises).slice().sort((left, right) => (PROMISE_ORDER[left.status] ?? 9) - (PROMISE_ORDER[right.status] ?? 9));
  const promiseHint = ["wrong", "open", "superseded", "done"].map((status) => [status, promises.filter((row) => row.status === status).length]).filter(([, n]) => n).map(([status, n]) => `${n} ${status}`).join(" · ") || "none";
  const page = [
    h("header", { class: "page" },
      h("div", { class: "eyebrow" }, `GitHub sweep · ${DATA.repo} · @${DATA.login}`),
      h("h1", {}, "What's waiting on you"),
      h("p", { class: "lede" }, DATA.summary),
      h("div", { class: "snapshot" }, `Snapshot ${when(DATA.generatedAt)}${sinceLine}`),
      h("div", { class: "stats" },
        stat("bad", counts.owed, "replies owed"),
        stat("bad", counts.fresh, "new since last sweep"),
        stat("warn", counts.reviews, "reviews owed"),
        stat("bad", counts.pending, "pending, not submitted"),
        stat("warn", counts.conflicts, "conflict with main"),
        stat("cool", counts.needsCode, "need code first")),
      h("div", { class: "standup" }, h("span", { class: "k" }, "Standup"), DATA.standup)),
    h("div", { class: "toolbar" },
      h("div", { class: "row" }, h("span", { class: "label" }, "Who"), personButtons),
      h("div", { class: "row" },
        h("span", { class: "label" }, "Show"), toggleButton("people only", "people"), toggleButton("new only", "fresh"), toggleButton("hide handled", "hideHandled"),
        action("expand all", () => setAll(true)), action("collapse all", () => setAll(false)),
        h("span", { class: "spacer" }),
        h("div", { class: "progress" }, progressText, h("div", { class: "bar" }, fill)))),
    section("first-moves", "First moves", "in this order", true, false,
      list(DATA.firstMoves).length
        ? h("ol", { class: "moves" }, list(DATA.firstMoves).map((move) => h("li", {}, h("div", {}, h("span", { class: "ref" }, jumpRefs(move.ref)), move.what, move.why ? h("div", { class: "why" }, move.why) : null))))
        : h("p", { class: "empty" }, "Nothing urgent.")),
    promises.length ? section("promises", "My promises", promiseHint, promises.some((row) => row.status === "open" || row.status === "wrong"), false,
      table(["Status", "Where", "Promise", "To", "Evidence"], promises.map((row) => [
        h("span", { class: `pill ${PROMISE_TONE[row.status] || ""}` }, row.status),
        jumpRefs(row.ref),
        link(row.url, row.promise),
        row.to || "",
        h("span", {}, row.evidence, row.confidence ? h("span", { class: `pill ${row.confidence}` }, row.confidence) : null)
      ]))) : null,
    list(DATA.needsCode).length ? section("needs-code", "Needs code before replying", "don't post these replies until the commit exists", false, false,
      table(["PR", "Fix", "Size"], list(DATA.needsCode).map((row) => [jumpRefs(`#${row.pr}`), row.fix, row.size]))) : null,
    list(DATA.conflicts).length ? section("conflicts", "Conflicts with main", `${counts.conflicts} PR${counts.conflicts === 1 ? "" : "s"}`, false, false,
      table(["PR", "Title", "Owner", "Conflicts in", "Note"], list(DATA.conflicts).map((row) => [jumpRefs(`#${row.pr}`), PRS.get(row.pr)?.title || "", PRS.get(row.pr)?.author || "", row.files || "", row.note || ""]))) : null,
    issueGroups.length ? section("by-issue", "By issue", "each issue with the PRs that close it", true, true, issueGroups) : null,
    mine.length ? section("mine", "My PRs with no issue", `${mine.length} open`, hasNew(mine), true, mine.map((pr) => prGroup(pr, false))) : null,
    reviews.length ? section("reviews", "Reviews I owe", "requested, re-review after a push, or started and never submitted", true, true, reviews.map((pr) => prGroup(pr, false))) : null,
    teammates.length ? section("teammates", "Replies on teammates' PRs", "threads where someone answered you", hasNew(teammates), true, teammates.map((pr) => prGroup(pr, false))) : null,
    list(DATA.quiet).length ? section("quiet", "Nothing owed", "checked, nothing waiting on you", false, false,
      h("div", { class: "quiet" }, list(DATA.quiet).map((row) => h("div", {}, h("code", {}, row.ref), ` ${row.note}`)))) : null,
    h("footer", {},
      `Read-only snapshot of ${DATA.repo}; nothing was posted. Ticks are kept in this browser, and the next sweep drops anything GitHub shows you've answered.`,
      list(DATA.notChecked).length ? h("ul", {}, list(DATA.notChecked).map((note) => h("li", {}, note))) : null)
  ];
  document.getElementById("render").append(...page.filter(Boolean));
  refresh();
</script>
</body>
</html>
