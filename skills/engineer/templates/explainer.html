<style>
  :root {
    --bg: #08070d;
    --panel-a: #1e1b2c;
    --panel-b: #151322;
    --ink: #ece9f5;
    --ink-2: #b8b4c6;
    --ink-dim: #78748a;
    --line: #322e45;
    --line-soft: #232032;
    --brand: #8b7cf0;
    --brand-bright: #ab9dff;
    --brand-glow: rgba(139,124,240,.18);
    --risk: #f0776b;
    --logic: #e9b44c;
    --mech: #6b6a80;
    --ok: #64c78d;
    --cool: #5aa9f0;
    --shadow: 0 1px 2px rgba(0,0,0,.55), 0 16px 44px -16px rgba(0,0,0,.85);
    --grid-dot: rgba(255,255,255,.035);
    --r: 14px;
  }
  html[data-theme="light"] {
    --bg: #f5f3fb;
    --panel-a: #ffffff;
    --panel-b: #efecf8;
    --ink: #201d2b;
    --ink-2: #565064;
    --ink-dim: #8b8698;
    --line: #e5e1f0;
    --line-soft: #eeebf7;
    --brand: #5b45d6;
    --brand-bright: #4a35b8;
    --brand-glow: rgba(96,74,211,.16);
    --risk: #c8463a;
    --logic: #a8740f;
    --mech: #918ca0;
    --ok: #2f9a5e;
    --cool: #2f6bc4;
    --shadow: 0 1px 2px rgba(30,20,50,.06), 0 14px 40px -20px rgba(30,20,50,.22);
    --grid-dot: rgba(45,30,80,.05);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.55;
    background: radial-gradient(900px 520px at 78% -8%, var(--brand-glow), transparent 60%), var(--bg);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 26px 26px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 70%);
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 52px 28px 100px; }
  code, .mono { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
  a { color: var(--brand-bright); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .theme-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 10; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; background: var(--panel-a);
    border: 1px solid var(--line); color: var(--ink-2); font-size: 16px; box-shadow: var(--shadow);
  }
  .theme-toggle .sun { display: none; }
  html[data-theme="light"] .theme-toggle .sun { display: block; }
  html[data-theme="light"] .theme-toggle .moon { display: none; }

  header.page { padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--brand); display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--brand); opacity: .7; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.08; margin: 0; letter-spacing: -0.02em; }
  .lede { color: var(--ink-2); max-width: 75ch; margin: 12px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-b); color: var(--ink-2);
  }
  .chip.verdict-approve, .chip.verdict-approve-with-fixes { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .chip.verdict-needs-discussion { color: var(--cool); border-color: color-mix(in srgb, var(--cool) 40%, transparent); }
  .chip.verdict-changes-requested { color: var(--logic); border-color: color-mix(in srgb, var(--logic) 40%, transparent); }
  .chip.verdict-do-not-merge { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 40%, transparent); }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
  .stack .layer { font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px dashed var(--line); color: var(--ink-dim); }
  .stack .layer.current { border-style: solid; border-color: var(--brand); color: var(--ink); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  .stack .arrow { color: var(--ink-dim); }

  section { margin-top: 38px; }
  h2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 21px; margin: 0 0 6px; }
  .sub { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 16px; }
  .card { background: linear-gradient(180deg, var(--panel-a), var(--panel-b)); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; }
  .grid { display: grid; gap: 14px; }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

  ol.look { margin: 0; padding: 0; list-style: none; counter-reset: look; display: grid; gap: 10px; }
  ol.look li { counter-increment: look; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  ol.look li::before {
    content: counter(look); font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 18px;
    color: var(--brand-bright); text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 2px 0;
  }
  .skim { color: var(--ink-2); margin-top: 14px; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }

  .flow h3 { margin: 0 0 12px; font-size: 16px; }
  .diagram { background: var(--panel-b); border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px; overflow-x: auto; }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram pre { margin: 0; white-space: pre-wrap; color: var(--ink-2); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  ol.steps { margin: 14px 0 0; padding-left: 22px; color: var(--ink-2); }
  ol.steps li { margin: 4px 0; }

  .against .label { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--risk); margin-bottom: 6px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters button {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-b); color: var(--ink-2); cursor: pointer;
  }
  .filters button.on { border-color: var(--brand); color: var(--ink); background: color-mix(in srgb, var(--brand) 14%, transparent); }
  .concern { margin-top: 16px; }
  .concern > .name { font-weight: 600; margin-bottom: 8px; }
  details.file { border: 1px solid var(--line-soft); border-left-width: 4px; border-radius: 10px; background: var(--panel-b); margin-bottom: 8px; }
  details.file.risk { border-left-color: var(--risk); }
  details.file.logic { border-left-color: var(--logic); }
  details.file.mechanical { border-left-color: var(--mech); }
  details.file summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; list-style: none; }
  details.file summary::-webkit-details-marker { display: none; }
  details.file summary .path { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink); }
  details.file summary .what { color: var(--ink-2); font-size: 13.5px; flex: 1 1 260px; }
  details.file summary .delta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-dim); }
  details.file .body { padding: 0 14px 12px 14px; color: var(--ink-2); font-size: 14px; }
  details.file .body ul { margin: 6px 0 0; padding-left: 18px; }
  .pill { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.risk { color: var(--risk); }
  .pill.logic { color: var(--logic); }
  .pill.mechanical { color: var(--mech); }
  .pill.blocker { color: var(--risk); }
  .pill.fix-before-merge { color: var(--logic); }
  .pill.nit, .pill.question { color: var(--mech); }
  .pill.decision { color: var(--cool); }

  ul.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.findings li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  footer { margin-top: 48px; color: var(--ink-dim); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }

  @media (max-width: 700px) { .wrap { padding: 40px 16px 80px; } }
</style>

<script>
  const DATA = JSON.parse(document.getElementById("pr-explainer-data").textContent);
  const VERDICTS = {
    "approve": "✅ Approve", "approve-with-fixes": "✅ Approve with fixes", "needs-discussion": "💬 Needs discussion",
    "changes-requested": "🟠 Changes requested", "do-not-merge": "🔴 Do not merge"
  };
  const CLASSES = ["risk", "logic", "mechanical"];

  // Every string from the PR is untrusted: nodes are built from text, and the only innerHTML is Mermaid's SVG under securityLevel strict.
  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([key, val]) => {
      if (val === undefined || val === null || val === false) { return; }
      if (key === "class") { node.className = val; } else { node.setAttribute(key, String(val)); }
    });
    children.flat().filter((child) => child !== undefined && child !== null && child !== false)
      .forEach((child) => node.append(child instanceof Node ? child : document.createTextNode(String(child))));
    return node;
  };

  const anchorLink = (anchor) => {
    const match = /^(.+):(\d+)(?:-(\d+))?$/.exec(anchor || "");
    const { repo, head } = DATA.pr;
    if (!match || !repo || !head) { return h("code", {}, anchor); }
    const [, path, start, end] = match;
    const lines = end ? `#L${start}-L${end}` : `#L${start}`;
    return h("a", { href: `https://github.com/${repo}/blob/${head}/${path}${lines}`, target: "_blank", rel: "noopener" }, h("code", {}, anchor));
  };

  const section = (title, sub, ...body) => h("section", {}, h("h2", {}, title), sub ? h("p", { class: "sub" }, sub) : null, ...body);

  const renderHeader = () => {
    const { pr, stack } = DATA;
    return h("header", { class: "page" },
      h("div", { class: "eyebrow" }, `PR #${pr.number}${pr.repo ? ` · ${pr.repo}` : ""}`),
      h("h1", {}, pr.title),
      h("p", { class: "lede" }, DATA.summary),
      h("div", { class: "chips" },
        h("span", { class: `chip verdict-${DATA.verdict}` }, VERDICTS[DATA.verdict] || DATA.verdict),
        h("span", { class: "chip" }, `risk ${DATA.risk}`),
        h("span", { class: "chip" }, `@${pr.author}`),
        h("span", { class: "chip" }, `${pr.head} → ${pr.base}`),
        pr.adds !== undefined ? h("span", { class: "chip" }, `+${pr.adds} / −${pr.dels ?? 0}`) : null,
        DATA.report ? h("a", { class: "chip", href: DATA.report }, "full review ↗") : null),
      stack && stack.length ? h("div", { class: "stack" },
        stack.flatMap((layer, i) => [
          i ? h("span", { class: "arrow" }, "→") : null,
          h("span", { class: `layer${layer.current ? " current" : ""}`, title: layer.title }, `#${layer.number} ${layer.title}`)
        ])) : null);
  };

  const renderLook = () => section("Where to look", "The hunks a human should read. Everything else was read by the review lanes.",
    h("div", { class: "card" },
      h("ol", { class: "look" }, DATA.lookAt.map((item) => h("li", {}, h("div", {}, anchorLink(item.anchor), h("div", {}, item.why))))),
      DATA.skim ? h("div", { class: "skim" }, "Skim · ", DATA.skim) : null));

  const renderDecisions = () => DATA.decisions && DATA.decisions.length ? section("Decisions this PR makes for you", "Choices someone could reasonably have made differently.",
    h("div", { class: "card" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Decision"), h("th", {}, "Picks"), h("th", {}, "Where"))),
      h("tbody", {}, DATA.decisions.map((row) => h("tr", {}, h("td", {}, row.decision), h("td", {}, row.picks), h("td", {}, anchorLink(row.anchor)))))))) : null;

  const renderFlows = () => section("How it works", "One diagram per flow, then the steps in code order.",
    h("div", { class: "grid" }, DATA.flows.map((flow) => h("div", { class: "card flow" },
      h("h3", {}, flow.title),
      h("div", { class: "diagram" }, h("pre", { class: "mermaid-src" }, flow.diagram)),
      flow.steps && flow.steps.length ? h("ol", { class: "steps" }, flow.steps.map((step) => h("li", {}, step.anchor ? [anchorLink(step.anchor), " "] : null, step.text))) : null))));

  const renderBehavior = () => DATA.behavior && DATA.behavior.length ? section("Before → after", "Behavior as a caller or user meets it.",
    h("div", { class: "card" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Case"), h("th", {}, "Before"), h("th", {}, "After"))),
      h("tbody", {}, DATA.behavior.map((row) => h("tr", {}, h("td", {}, row.case), h("td", {}, row.before), h("td", {}, row.after))))))) : null;

  const renderAgainst = () => {
    const against = DATA.caseAgainst;
    if (!against) { return null; }
    const tile = (label, text) => h("div", { class: "card against" }, h("div", { class: "label" }, label), h("div", {}, text));
    return section("Case against", null, h("div", { class: "grid three" },
      tile("Strongest argument against merging", against.strongest),
      tile("Most likely to bite in three months", against.threeMonths),
      tile("If 40% had to go", against.cut)));
  };

  const renderFiles = () => {
    const list = h("div", {});
    const counts = CLASSES.map((cls) => [cls, DATA.files.filter((file) => file.class === cls).length]);
    const draw = (filter) => {
      list.replaceChildren();
      const files = DATA.files.filter((file) => filter === "all" || file.class === filter);
      const concerns = [...new Set(files.map((file) => file.concern))];
      concerns.forEach((concern) => list.append(h("div", { class: "concern" },
        h("div", { class: "name" }, concern),
        files.filter((file) => file.concern === concern).map((file) => h("details", { class: `file ${file.class}`, open: file.class === "risk" ? "" : null },
          h("summary", {},
            h("span", { class: `pill ${file.class}` }, file.class),
            h("span", { class: "path" }, file.path),
            h("span", { class: "what" }, file.summary),
            file.adds !== undefined ? h("span", { class: "delta" }, `+${file.adds} −${file.dels ?? 0}`) : null),
          file.hunks && file.hunks.length ? h("div", { class: "body" }, h("ul", {},
            file.hunks.map((hunk) => h("li", {}, anchorLink(`${file.path}:${hunk.lines}`), " ", hunk.text)))) : null)))));
    };
    const buttons = ["all", ...CLASSES].map((filter) => h("button", { "data-filter": filter, class: filter === "all" ? "on" : "" },
      filter === "all" ? `all ${DATA.files.length}` : `${filter} ${counts.find(([cls]) => cls === filter)[1]}`));
    buttons.forEach((button) => button.addEventListener("click", () => {
      buttons.forEach((other) => other.classList.toggle("on", other === button));
      draw(button.getAttribute("data-filter"));
    }));
    draw("all");
    return section("File map", "Every file, grouped by concern. Risk files start open.", h("div", { class: "filters" }, buttons), list);
  };

  const renderFindings = () => DATA.findings && DATA.findings.length ? section("Findings", "Detail and paste-ready comments live in the full review.",
    h("div", { class: "card" }, h("ul", { class: "findings" }, DATA.findings.map((finding) => h("li", {},
      h("span", { class: `pill ${finding.severity}` }, finding.severity), h("span", {}, finding.title), anchorLink(finding.anchor)))))) : null;

  const root = document.getElementById("render");
  root.append(renderHeader(), renderLook(), renderDecisions(), renderFlows(), renderBehavior(), renderAgainst(), renderFiles(), renderFindings(),
    h("footer", {}, "Rendered from the pr-explainer-data block in this file. Diagram sources show as text when the diagram library can't load."));
  document.title = `PR #${DATA.pr.number} — ${DATA.pr.title}`;

  let mermaidLib = null;
  const drawDiagrams = async () => {
    if (!mermaidLib) { return; }
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    mermaidLib.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
    const boxes = [...document.querySelectorAll(".diagram")];
    await Promise.all(boxes.map(async (box, i) => {
      const source = box.dataset.source || box.textContent;
      box.dataset.source = source;
      try {
        const { svg } = await mermaidLib.render(`diagram-${i}-${Date.now()}`, source);
        box.innerHTML = svg;
      } catch (err) {
        box.replaceChildren(h("pre", {}, source));
      }
    }));
  };
  import("https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.esm.min.mjs")
    .then((module) => { mermaidLib = module.default; return drawDiagrams(); })
    .catch(() => {});

  document.getElementById("themeToggle").addEventListener("click", () => {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) { document.documentElement.removeAttribute("data-theme"); } else { document.documentElement.setAttribute("data-theme", "light"); }
    try { localStorage.setItem("pr-explainer-theme", light ? "dark" : "light"); } catch (e) {}
    drawDiagrams();
  });
</script>
</body>
</html>
